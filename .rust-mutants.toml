# rust-mutants against this repository. `mise run dogfood:engine:audit` runs
# this and then re-decides what the run reported from the recording it kept.
#
# Every package of the workspace is here, the runner included. `mise run
# dogfood` points the runner at the workspace, which is the runner measuring
# somebody else; this is the runner being measured, and the two are different
# questions. A repository that says it measures itself and leaves half of
# itself out is one whose scope does not match its claim.
#
# A survivor here is a test to write or an acceptance to record below with a
# reason. `cargo xtask engine-audit <run> --ledger .rust-mutants.toml` refuses
# a run that leaves one unexplained, and refuses an acceptance the run no
# longer holds.

version = 1

[project]
packages = ["rust-mutants", "rust-mutants-cli", "mjutest-cli", "xtask"]

[mutation]
tier = "all"

[execution]
offline = true
locked = true

# A place the tests answer for by construction rather than by running.
#
# `Phase` ends its phase in `Drop`, so the explicit `end()` at the tail of a
# function is there for a reader and not for the recording. That is the design
# — a phase nobody can forget to close — and the invariant it rests on has a
# test of its own: `trace.rs::a_phase_guard_ends_its_phase_once_with_its_duration_and_phases_nest`
# drops a guard without calling `end` and still finds the `phase-end`. An
# acceptance whose reason is an invariant is only as good as the test on that
# invariant, so the test is named here for whoever reads this next.
[[mutation.expect]]
path = "crates/rust-mutants/src/prove.rs"
item = "establish"
rule = "delete-call-statement"
original = "phase.end();"
reason = "Phase ends its phase on Drop, so the explicit end at the tail of establish changes no recording; a_phase_guard_ends_its_phase_once_with_its_duration_and_phases_nest holds that"
