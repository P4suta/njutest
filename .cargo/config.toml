# Project-level cargo config.
#
# Linker policy: mold/lld are NOT forced here at the project level because
# doing so would break any environment that doesn't ship the linker. CI sets
# the linker through the setup-rust composite action instead, and a developer
# who wants the speedup locally can put the per-target stanza in
# ~/.cargo/config.toml.

[build]
# Set by `mise run` and by CI, never here: a wrapper named in this file is one
# every `cargo` in every checkout must have, and a developer without it gets a
# build that will not start rather than one that is merely slower. The same
# reasoning as the linker above.

[alias]
xtask = "run --quiet --locked --package xtask --"

[net]
# CI on slow / flaky networks benefits from extra retries on registry fetches.
retry = 10

[term]
verbose = false
