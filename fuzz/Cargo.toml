# SPDX-FileCopyrightText: 2026 mjutest contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# cargo-fuzz targets for the engine's fail-closed parsers and byte
# transformations. Standalone (not a workspace member): fuzzing needs nightly
# and a sanitizer, and the root lint set does not apply to harness code.

[package]
name = "rust-mutants-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"
mjutest-cli = { path = "../crates/mjutest-cli" }
rust-mutants = { path = "../crates/rust-mutants" }
rust-mutants-cli = { path = "../crates/rust-mutants-cli" }
serde_json = "1"
toml = "1.1"

[[bin]]
name = "flatten"
path = "fuzz_targets/flatten.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_reader"
path = "fuzz_targets/trace_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glob"
path = "fuzz_targets/glob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "splice"
path = "fuzz_targets/splice.rs"
test = false
doc = false
bench = false

[[bin]]
name = "discover_file"
path = "fuzz_targets/discover_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize_path"
path = "fuzz_targets/normalize_path.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "coverage_export"
path = "fuzz_targets/coverage_export.rs"
test = false
doc = false
bench = false

[[bin]]
name = "libtest_summary"
path = "fuzz_targets/libtest_summary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_document"
path = "fuzz_targets/report_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_config"
path = "fuzz_targets/engine_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "run_report"
path = "fuzz_targets/run_report.rs"
test = false
doc = false
bench = false
