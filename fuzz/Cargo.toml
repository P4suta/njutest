# SPDX-FileCopyrightText: 2026 njutest contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# cargo-fuzz targets for the engine's fail-closed parsers and byte
# transformations. Standalone (not a workspace member): fuzzing needs nightly
# and a sanitizer. `cargo xtask fuzz-clippy` derives the root workspace's
# rustc and Clippy policy and applies it to every target without copying it here.

[package]
name = "rust-mutants-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"
njutest-devkit = { path = "../crates/njutest-devkit" }
njutest = { path = "../crates/njutest", features = ["testkit"] }
rust-mutants = { path = "../crates/rust-mutants" }
rust-mutants-cli = { path = "../crates/rust-mutants-cli" }
serde_json = "1"
tempfile = "3"
toml = "1.1"

[[bin]]
name = "flatten"
path = "fuzz_targets/flatten.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_reader"
path = "fuzz_targets/trace_reader.rs"
