[package]
name = "xtask"
description = "Repository gates and developer tools: the seam ratchet, dependency direction, fixture conventions, release consistency"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
autotests = false

[package.metadata.njutest]
surface = "incidental"

[features]
testkit = []

[dependencies]
njutest-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
proc-macro2 = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
njutest-devkit = { workspace = true }
xtask = { path = ".", features = ["testkit"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
