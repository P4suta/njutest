[package]
name = "fixture-strict-lints"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]

[lints.rust]
warnings = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"
