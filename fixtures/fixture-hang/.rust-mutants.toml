# The two halves of this fixture pull the bound in opposite directions, so each
# is given a prop of its own rather than made to share one.
#
# The count half is a race against the clock, and what settles it is how much
# the count costs rather than how long the bound is. Lengthening the bound
# would win the race by moving its cost to the moment the count breaks: every
# non-terminating mutant would then wait out the whole bound, twice, and the
# person reading a suite that had just started failing would read it slowly.
# A bound is also what says a hang is a hang, so it stays short and the count
# is made cheap instead.
#
# `count_to` has mutations that never return, and the count is what stops them.
# The durable step protocol pays one locked state-file round trip per take, and
# what that round trip costs belongs to the platform rather than the protocol:
# measured on Windows it is about 7.3ms against a fixed 55ms of starting, where
# the machines this fixture was first written on spend a fraction of it. A
# hundred takes cost 789ms of the two seconds below — a margin of two and a
# half, which a CI runner on slower storage closed, and a proved
# non-termination arrived as a mere `waited` with no notice.
#
# Ten takes cost 129ms, which is that margin made six times wider for nothing.
# The floor is what an ordinary execution of this fixture spends, and that is a
# count rather than a duration, so it is the same number on every platform: five
# exactly. At five a killed mutant is reported as having reached the allowance;
# at six it is not.
#
# Ten keeps only twice the floor, and that is the right way round. Crossing the
# floor is deterministic — the same source spends the same count everywhere, so
# it fails the same way on every machine and says so plainly. Losing to the
# clock is not: it depends on what else the machine was doing, so it arrives as
# a test that passes until it does not. Headroom is worth more where the failure
# would be flaky than where it would be reproducible, so what there is of it
# goes to the clock.
#
# The engine's default of fifty million is sized for the in-memory counter this
# protocol replaced and is unreachable at durable cost.
#
# The 7.3ms above is what a take cost when every one of them ended in `fsync`.
# Only the write that publishes the final notice is durable now, so a take is
# cheaper than this by a wide margin and the race is less close than these
# numbers describe. They are left as written because they are what the allowance
# was chosen against, and because a number nobody has re-measured on the machine
# that produced it is not a number to quietly replace: the floor of five is a
# count and has not moved, so the allowance of ten is still right whichever way
# the cost went.
#
# `clamp_positive` is merely slow, under FIXTURE_HANG_PAUSE_MS, and the clock is
# what has to answer for it. That wants a bound a four-second sleep can beat,
# which is the other reason the bound stays where it is. A sleep only gets
# longer under load, so a machine can only make the clock answer sooner than
# the sleep, never later: that half needs no margin at all.

version = 1

[mutation]
timeout = "2s"
steps = 10
