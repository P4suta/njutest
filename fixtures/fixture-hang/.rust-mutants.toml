# `count_to` has mutations that never return, and the count is what stops them.
# An execution that counts is bounded by how long it may go without raising the count, so the clock never stops the loop while it spins.
# The allowance only has to sit above what an ordinary execution of this fixture spends, which is five: a count, and the same on every platform.
# At five a killed mutant is reported as having reached the allowance; at six it is not.
#
# `clamp_positive` is merely slow, under FIXTURE_HANG_PAUSE_MS, and a sleep raises no count, so the clock is what has to answer for it.
# That wants a bound a four-second sleep can beat.
# A sleep only gets longer under load, so a machine can only make the clock answer sooner than the sleep, never later.

version = 1

[mutation]
timeout = "2s"
steps = 10
