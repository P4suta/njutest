# The two halves of this fixture pull the bound in opposite directions, so each
# is given a prop of its own rather than made to share one.
#
# `count_to` has mutations that never return. The count stops them: the
# durable step protocol pays one locked state-file round trip per take, so a
# guard taken a hundred times fires in well under half a second, several times
# inside the bound below, and no amount of load can let the clock answer
# first. The engine's default of fifty million is sized for the in-memory
# counter this protocol replaced and is unreachable at durable cost.
#
# `clamp_positive` is merely slow, under FIXTURE_HANG_PAUSE_MS, and the clock is
# what has to answer for it. That wants a bound a four-second sleep can beat,
# which is why the bound stays low. A sleep only gets longer under load, so this
# half has the margin the other one did not.

version = 1

[mutation]
timeout = "2s"
steps = 100
