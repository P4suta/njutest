#
# Tool pins and the task runner. `justfile` is a thin wrapper over these.
# The cargo-tool versions mirror CI's install-action pins
# (.github/workflows/ci.yml) for local == CI parity — bump them together.

[tools]
rust = "1.98.0"
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.48.0"
lefthook = "2.1.9"
committed = "1.1.11"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-deny" = "0.19.7"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
mdbook = "0.5.4"

[tasks.bootstrap]
description = "Fetch the locked dependency graph and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.book]
description = "Build the documentation as a book, into target/book"
run = "mdbook build docs"

[tasks."book:serve"]
description = "Build the book and reload it in a browser as the pages change"
run = "mdbook serve docs"

[tasks.doctor]
description = "Report which development tools are present and whether their versions match the pins"
run = "bash scripts/doctor.sh"

[tasks.build]
description = "Build every crate and every target"
run = "cargo build --locked --workspace --all-targets"

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo fmt --all", "taplo fmt"]

[tasks."fmt:check"]
description = "Check Rust and TOML formatting without rewriting files"
run = ["cargo fmt --all -- --check", "taplo fmt --check", "taplo lint"]

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.doc]
description = "Build rustdoc with broken links and warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --locked --workspace --no-deps --document-private-items"

[tasks.gates]
description = "Run the repository gates: seam ratchet, dependency direction, fixture conventions, release consistency"
run = [
  "cargo xtask devgates",
  "cargo xtask lints",
  "cargo xtask deps",
  "cargo xtask fixtures",
  "cargo xtask release-check",
]

[tasks.lint]
description = "Run clippy, rustdoc, the repository gates, the fuzz targets' own type check, spelling, TOML, and workflow linters"
depends = ["clippy", "doc", "gates", "fuzz:check"]
run = ["typos", "actionlint"]

[tasks."build:examples"]
description = "Build the scripted cargo the suite drives, which no test build produces"
# `cargo test --all-targets` builds an example as a test harness rather than as
# the program it is, so a suite that drives one has to ask for it plainly.
run = "cargo build --locked --examples -p rust-mutants"

[tasks."test:fast"]
description = "Run every test that starts no toolchain: the inner loop, seconds rather than a minute"
depends = ["build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --status-level fail -E 'not binary(/^toolchain_/)'"
run_windows = "cargo nextest run --locked --workspace --all-targets --status-level fail -E 'not binary(/^toolchain_/)'"

[tasks."test:slow"]
description = "Run the suites that drive a real cargo against the fixture projects"
depends = ["build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --status-level fail -E 'binary(/^toolchain_/)'"
run_windows = "cargo nextest run --locked --workspace --all-targets --status-level fail -E 'binary(/^toolchain_/)'"

[tasks."test:doc"]
description = "Run the doctests, which nextest does not"
run = "cargo test --locked --workspace --doc"

[tasks.test]
description = "Run the complete suite: every target through nextest, then the doctests"
depends = ["test:fast", "test:slow", "test:doc"]

[tasks.coverage]
description = "Measure region coverage with the ratchet CI enforces (never lower the floor)"
depends = ["build:examples"]
run = "cargo llvm-cov --locked --workspace --all-targets --all-features --summary-only --fail-under-regions 80"

[tasks.deny]
description = "Check licenses, advisories, bans, and sources"
run = "cargo deny --locked check"

[tasks.audit]
description = "Check the dependency graph against the RustSec advisory database"
run = "cargo audit --deny warnings"

[tasks."fuzz:check"]
description = "Type-check every cargo-fuzz target on the toolchain the workspace uses, so one cannot rot against an API change unnoticed"
dir = "fuzz"
run = "cargo check --locked --all-targets"

[tasks."fuzz:build"]
description = "Build every cargo-fuzz target (nightly, sanitizer) without running one"
dir = "fuzz"
run = "cargo +nightly fuzz build"

[tasks."fuzz:smoke"]
description = "Run every cargo-fuzz target briefly, the way CI does on a pull request"
dir = "fuzz"
shell = "bash -c"
run = """
set -euo pipefail
for target in $(cargo +nightly fuzz list); do
  echo "== $target"
  cargo +nightly fuzz run "$target" -- -runs=2000 -max_len=1024
done
"""

[tasks.mutants]
description = "Run cargo-mutants, the external mutation tester, against this workspace"
run = "cargo mutants --config .cargo/mutants.toml --workspace"

# The order is cheapest refusal first, which is not the order CI runs them in:
# CI runs the jobs at once and waits for all of them, and a person waits for
# each in turn. Formatting answers in seconds, rustdoc and clippy and the
# repository gates in tens of them, the suite in minutes. Two broken
# documentation links and two fuzz targets naming code that had been deleted
# all lived behind a three-minute suite, and every one of them is something
# `lint` says in seventeen seconds.
[tasks.check]
description = "Run every local gate, the ones that answer quickest first"
run = ["mise run fmt:check", "mise run build", "mise run lint", "mise run test", "mise run deny"]

[tasks.bench]
description = "Observe what every stage costs. Numbers, never gates"
shell = "bash -c"
run = """
set -euo pipefail
cargo bench -p rust-mutants --bench foundation -- "$@"
cargo bench -p rust-mutants --bench pipeline -- "$@"
cargo bench -p njutest-cli --bench report -- "$@"
cargo bench -p njutest-cli --bench evidence -- "$@"
"""

[tasks.dogfood]
description = "Point njutest at this workspace and read the verdict it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain "$@"
"""

[tasks."dogfood:audit"]
description = "Run njutest on this workspace and re-decide the recording it leaves"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain --trace "$@" || true
run="$(ls -dt reports/runs/*/ | head -1)"
trace="$(ls -dt .njutest/trace/*/ | head -1)"
echo "re-deciding ${run} from ${trace}"
cargo build --release -p xtask
./target/release/xtask proofaudit "${run}" --trace "${trace}"
"""

[tasks."dogfood:engine"]
description = "Point rust-mutants at this workspace and read the score it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@"
"""

[tasks."dogfood:engine:audit"]
description = "Run rust-mutants on its own engine and re-decide the report it wrote"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
cargo build --release -p xtask
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@" || true
run="$(ls -dt reports/mutation/*/ 2>/dev/null | head -1)"
if [ -z "${run}" ] || [ ! -f "${run}run-report-v1.json" ]; then
  echo "the run left no report to re-decide; read what it said above" >&2
  exit 2
fi
echo "re-deciding ${run} from its own recording"
./target/release/rust-mutants trace check --dir "${run}trace"
./target/release/xtask engine-audit "${run%/}" --trace "${run}trace" --sites --ledger .rust-mutants.toml
"""

[tasks."engine-audit"]
description = "Re-decide a stored engine run from its own rows, recording, and ledger"
run = "cargo run -q -p xtask -- engine-audit \"$@\""

[tasks."trace:check"]
description = "Say whether a recording is complete: it begins, it ends, and it lost nothing"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --bin rust-mutants
./target/debug/rust-mutants trace check "$@"
"""
