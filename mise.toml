# SPDX-FileCopyrightText: 2026 njutest contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Tool pins and the task runner. `justfile` is a thin wrapper over these.
# The cargo-tool versions mirror CI's install-action pins
# (.github/workflows/ci.yml) for local == CI parity — bump them together.
#
# A `cargo:` entry is built from source for the machine it is installed on. The
# plain ones are downloaded, and a release that ships no asset for an
# architecture leaves a binary that will not start on it: `committed` moved
# here after an operating system upgrade left its x86_64 download unable to
# exec, which stops every commit and says only "Bad CPU type in executable".

# Every `mise run` and every shell mise has activated compiles through the
# cache. Here rather than in `.cargo/config.toml` because a wrapper named
# there is one every checkout must have installed: a developer without it
# would get a build that will not start, where this gives them one that is
# merely as slow as it was before.
[env]
# A caller that has already said what the wrapper is keeps it, and a caller that says nothing gets sccache.
# `mise run` re-applies this table inside the task, so a job that cleared the variable in its own environment would have it put back; deferring here is what makes the clear survive.
# An empty value is a value: cargo treats an empty `RUSTC_WRAPPER` as no wrapper at all, which is how CI asks for the compiler it already caches through `Swatinem/rust-cache` rather than one more program to install.
RUSTC_WRAPPER = "{{ env.RUSTC_WRAPPER | default(value='sccache') }}"

[tools]
rust = "1.98.0"
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.50.1"
lefthook = "2.1.9"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-deny" = "0.19.7"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:committed" = "1.1.11"
# A compilation cache, keyed on the content of what it is asked to compile.
#
# The toolchain suite copies a fixture into a temporary tree and starts a real
# cargo against it, three hundred times over thirty-eight fixtures, and each of
# those builds is isolated under its own target directory on purpose
# (ADR 0019): a test that picked up another test's instrumented artifact would
# be one measurement contaminating another, which is the defect this whole
# product is against. Isolation stays. What goes is recompiling the identical
# unit: 847ms cold, 402ms with this, with every target directory still its own.
sccache = "0.17.0"
mdbook = "0.5.4"

[tasks.bootstrap]
description = "Fetch the locked dependency graph and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.book]
description = "Build the documentation as a book, into target/book"
run = "mdbook build docs"

[tasks."book:serve"]
description = "Build the book and reload it in a browser as the pages change"
run = "mdbook serve docs"

[tasks.doctor]
description = "Report which development tools are present and whether their versions match the pins"
run = "bash scripts/doctor.sh"

[tasks.build]
description = "Build every crate and every target"
run = "cargo build --locked --workspace --all-targets --all-features"

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo fmt --all", "taplo fmt"]
# taplo lists every file it read at INFO, which is seventy lines of noise in
# front of whatever it has to say.
env = { RUST_LOG = "warn" }

[tasks."fmt:check"]
description = "Check Rust and TOML formatting without rewriting files"
run = ["cargo fmt --all -- --check", "taplo fmt --check", "taplo lint"]
env = { RUST_LOG = "warn" }

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.doc]
description = "Build rustdoc with broken links and warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --locked --workspace --no-deps --document-private-items"

# `cargo xtask all` rather than a list of subcommands: the list was a second enumeration of the set `gates::all` already holds, and CI runs the one command.
# Two enumerations of one set is the defect this repository keeps closing everywhere else.
[tasks.gates]
description = "Run the repository gates: seam ratchet, dependency direction, fixture conventions, release consistency"
run = "cargo xtask all"

[tasks.lint]
description = "Run formatting, clippy, rustdoc, the repository gates, the fuzz targets under the same Clippy policy, spelling, TOML, and workflow linters"
depends = ["fmt:check", "clippy", "doc", "gates", "fuzz:clippy", "committed:range"]
run = ["typos", "actionlint"]

[tasks."committed:range"]
description = "Check exactly the commits unique to this branch against the current origin/main"
shell = "bash -c"
run = """
set -euo pipefail
base_ref="${NJUTEST_COMMITTED_BASE_REF:-origin/main}"
head_ref="${NJUTEST_COMMITTED_HEAD:-HEAD}"
git rev-parse --verify "${base_ref}^{commit}" >/dev/null
git rev-parse --verify "${head_ref}^{commit}" >/dev/null
committed "${base_ref}..${head_ref}"
"""

# The suite is written for three platforms and run here on one. Most of what
# the other two answer differently needs their machine to find out, but code
# behind `#[cfg(windows)]` is not even read by this one's compiler, and a
# workspace that builds here can fail to build there on a lint. This asks for
# the reading without the machine; the prerequisite task installs that target's
# standard library for the same exact compiler the workspace pins.
[tasks."setup:windows-target"]
description = "Install the pinned Windows standard library used by the cross-target type check"
run = "rustup target add --toolchain 1.98.0 x86_64-pc-windows-msvc"

[tasks."check:windows"]
description = "Type-check every non-benchmark target with every non-benchmark feature for Windows; real Windows CI covers feature-complete benchmarks"
depends = ["setup:windows-target"]
run = "cargo check --locked --workspace --all-targets --features njutest/testkit,rust-mutants-cli/testkit,rust-mutants/testkit,xtask/testkit --target x86_64-pc-windows-msvc"

# CI's Linux runners are where a `cfg` this machine never compiles is first read, and `-D warnings` turns each one into a failed job rather than a note.
# Three arrived at once the first time CI got far enough to run clippy: a function that is const once the macOS branch is gone, a placeholder binding with nothing to bind, and a widening conversion that is the identity where `st_mode` is already a u32.
# Benchmarks stay out for the same reason they stay out of the Windows check: criterion's build script wants a C cross-compiler, and the lints being looked for are not in a bench.
[tasks."setup:linux-target"]
description = "Install the pinned Linux standard library used by the cross-target lint"
run = "rustup target add --toolchain 1.98.0 x86_64-unknown-linux-gnu"

[tasks."lint:linux"]
description = "Lint every non-benchmark target for Linux, where CI reads the cfgs this machine does not compile"
depends = ["setup:linux-target"]
run = "cargo clippy --locked --workspace --all-targets --features njutest/testkit,rust-mutants-cli/testkit,rust-mutants/testkit,xtask/testkit --target x86_64-unknown-linux-gnu -- -D warnings"

[tasks."build:examples"]
description = "Build the scripted cargo the suite drives, which no test build produces"
# `cargo test --all-targets` builds an example as a test harness rather than as
# the program it is, so a suite that drives one has to ask for it plainly.
run = "cargo build --locked --examples --workspace --all-features --profile test"

[tasks."test:fast"]
description = "Run every test that starts no toolchain: the inner loop, seconds rather than a minute"
depends = ["build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail -E 'not binary(/^toolchain_/)'"
# cmd.exe is not a POSIX shell: it leaves single quotes in the argument rather than taking them off, so the filterset reaches nextest as `'not` and the task dies parsing it before a single test runs.
# Double quotes are what this shell spells the same intent with.
run_windows = 'cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail -E "not binary(/^toolchain_/)"'

# Each test in these binaries drives its own Cargo. CI adds `--test-threads 2`
# on top of this, because a hosted runner multiplies those build jobs into
# resource exhaustion; a developer's machine is not that machine, and the bound
# costs minutes there without changing which tests pass.
[tasks."exec-tax"]
description = "Report what it costs to run a newly written file, which is what a suite of fixture binaries pays per binary"
run = "bash scripts/exec-tax.sh"

[tasks."test:slow"]
description = "Run the suites that drive a real cargo against the fixture projects"
depends = ["exec-tax", "build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail --test-threads 2 -E 'binary(/^toolchain_/)'"
run_windows = 'cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail --test-threads 2 -E "binary(/^toolchain_/)"'

[tasks."test:doc"]
description = "Run the doctests, which nextest does not"
run = "cargo test --locked --workspace --all-features --doc"

[tasks.test]
description = "Run the complete suite: every target through nextest, then the doctests"
run = ["mise run test:fast", "mise run test:slow", "mise run test:doc"]

[tasks."kani:verified"]
description = "Run the generated-harness and strict-result protocol suite with the pinned Kani 0.68 installation"
depends = ["kani:laws"]
run = "env -u RUSTFLAGS NJUTEST_REAL_KANI=1 cargo test --locked --workspace --all-features --lib real_kani_068 -- --test-threads=1"

[tasks."kani:laws"]
description = "Prove and independently audit the production laws with the pinned Kani 0.68 installation"
run = """
set -eu
export_file="$(mktemp "${TMPDIR:-/tmp}/njutest-kani-laws.XXXXXX")"
cleanup() { rm -f "$export_file"; }
trap cleanup EXIT HUP INT TERM
env -u RUSTFLAGS cargo kani -p rust-mutants --lib --exact --no-assertion-reach-checks \
  --harness instrument::runtime::kani_laws::a_counting_checkpoint_counts \
  --harness instrument::runtime::kani_laws::a_counting_checkpoint_never_stops \
  --harness instrument::runtime::kani_laws::a_dormant_checkpoint_cannot_spend \
  --harness instrument::runtime::kani_laws::counting_is_not_reachable_from_dormant_or_active \
  --harness instrument::runtime::kani_laws::activation_is_idempotent \
  --harness instrument::runtime::kani_laws::an_active_checkpoint_advances_or_reaches_the_exact_boundary \
  --harness instrument::runtime::kani_laws::stopping_is_absorbing \
  --harness session::kani_laws::attempt_duration_is_the_checked_sum_of_every_execution \
  --harness session::kani_laws::attempt_ledger_is_nonempty_and_its_result_is_derived \
  --harness session::kani_laws::cancellation_before_retry_cannot_create_a_retry \
  --harness session::kani_laws::cancelled_retry_is_structurally_not_run \
  --harness session::kani_laws::equal_outcomes_choose_the_canonical_target_in_every_order \
  --harness session::kani_laws::killed_is_absorbing \
  --harness session::kani_laws::retry_reconciliation_is_closed \
  --harness session::kani_laws::survived_means_every_nonempty_target_survived \
  --harness session::kani_laws::target_join_is_associative \
  --harness session::kani_laws::target_join_is_commutative \
  --harness session::kani_laws::target_join_is_idempotent \
  -Z unstable-options --export-json "$export_file"
cargo xtask kani-laws-audit "$export_file"
"""

# The floors are the ones .github/workflows/ci.yml enforces, in the same order
# and with the same scoping. Never lower one; raise one when its suite earns it,
# in both places at once. The collection is that job's as well, down to the
# environment it exports and the two runs it splits the suite into: a gate that
# measured a different way is a gate that answers a different question, and the
# one that job asks is the one that has to be green.
[tasks.coverage]
description = "Measure region coverage with the ratchet CI enforces (never lower a floor)"
depends = ["exec-tax", "build:examples"]
shell = "bash -c"
run = """
set -euo pipefail
cargo clean
cargo llvm-cov clean --workspace
eval "$(cargo llvm-cov show-env --export-prefix)"
cargo build --locked --examples --workspace --all-features --profile test
cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail -E 'not binary(/^toolchain_/)'
cargo nextest run --locked --workspace --all-targets --all-features --fail-fast --status-level fail --test-threads 2 -E 'binary(/^toolchain_/)'
cargo llvm-cov report --summary-only --fail-under-regions 80 \
  --ignore-filename-regex 'compiler-surfaces/'
cargo llvm-cov report --summary-only --fail-under-regions 87 \
  --ignore-filename-regex 'crates/(rust-mutants-cli|njutest|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
cargo llvm-cov report --summary-only --fail-under-regions 83 \
  --ignore-filename-regex 'crates/(rust-mutants|njutest|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
cargo llvm-cov report --summary-only --fail-under-regions 81 \
  --ignore-filename-regex 'crates/(rust-mutants|rust-mutants-cli|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
cargo llvm-cov report --summary-only --fail-under-regions 80 \
  --ignore-filename-regex 'crates/|fuzz/|compiler-surfaces/'
"""

[tasks.package]
description = "Package every publishable member, install both CLIs, and write what a release would say it is made of"
shell = "bash -c"
run = """
set -euo pipefail
install_root="$(mktemp -d "${TMPDIR:-/tmp}/njutest-package-install.XXXXXX")"
cleanup() { rm -rf -- "$install_root"; }
trap cleanup EXIT HUP INT TERM
export CARGO_TARGET_DIR="$install_root/target"
cargo package --locked --workspace --no-verify --allow-dirty --exclude-lockfile
cargo install --locked --path crates/njutest --root "$install_root"
cargo install --locked --path crates/rust-mutants-cli --root "$install_root"
"$install_root/bin/njutest" --version
"$install_root/bin/rust-mutants" --version
PATH="$install_root/bin:$PATH" cargo njutest --version
PATH="$install_root/bin:$PATH" cargo rust-mutants --version
cargo xtask sbom --output "$install_root/njutest.cdx.json"
"""

[tasks.deny]
description = "Check licenses, advisories, bans, and sources"
run = [
  "cargo deny --locked --all-features fetch db",
  "cargo deny --locked --all-features check --disable-fetch",
]

[tasks.audit]
description = "Check the dependency graph against the RustSec advisory database"
shell = "bash -c"
run = """
set -uo pipefail
db="${CARGO_TARGET_DIR:-target}/advisory-db"
fetched=false
for attempt in 1 2 3 4 5; do
  if [ -d "${db}/.git" ]; then
    git -C "${db}" fetch --quiet --depth 1 origin main && git -C "${db}" reset --quiet --hard FETCH_HEAD && fetched=true
  else
    rm -rf "${db}"
    git clone --quiet --depth 1 https://github.com/RustSec/advisory-db.git "${db}" && fetched=true
  fi
  status=$?
  [ "${fetched}" = true ] && break
  echo "audit: fetching the advisory database exited ${status} on attempt ${attempt} of 5" >&2
  sleep $((attempt * 5))
done
if [ "${fetched}" = false ]; then
  [ -d "${db}/.git" ] || { echo "audit: no advisory database was ever fetched into ${db}" >&2; exit 1; }
  echo "audit: checking against the copy in ${db}, last updated $(git -C "${db}" log -1 --format=%cI), not a fresh one" >&2
fi
cargo audit --no-fetch --deny warnings --db "${db}" || {
  status=$?
  echo "audit: cargo audit exited ${status}; its own output above says why" >&2
  exit "${status}"
}
"""

[tasks."fuzz:clippy"]
description = "Lint every cargo-fuzz target with the root workspace's exact rustc and Clippy policy"
env = { CARGO_NET_OFFLINE = "false" }
run = "cargo xtask fuzz-clippy"

[tasks."fuzz:build"]
description = "Build every cargo-fuzz target (nightly, sanitizer) without running one"
dir = "fuzz"
run = "cargo +nightly fuzz build"

[tasks."fuzz:smoke"]
description = "Seed and run every cargo-fuzz target briefly, the same entry path as weekly CI"
dir = "fuzz"
shell = "bash -c"
run = """
set -euo pipefail
for target in $(cargo +nightly fuzz list); do
  echo "== $target"
  bash ../scripts/seed-fuzz-corpus.sh "$target"
  cargo +nightly fuzz run "$target" -- -runs=2000 -max_len=1024
done
"""

[tasks.mutants]
description = "Run cargo-mutants, the external mutation tester, against this workspace"
run = "cargo mutants --config .cargo/mutants.toml --workspace"

# The order is cheapest refusal first, which is not the order CI runs them in:
# CI runs the jobs at once and waits for all of them, and a person waits for
# each in turn. Formatting answers in seconds, rustdoc and clippy and the
# repository gates in tens of them, the suite in minutes. Two broken
# documentation links and two fuzz targets naming code that had been deleted
# all lived behind a three-minute suite, and every one of them is something
# `lint` says in seventeen seconds.
# What this leaves to CI is what this machine cannot answer: the suite on the
# other two platforms, the coverage ratchets (a second instrumented run of
# everything), the suite under the interpreter, and the composite action driven
# the way another repository drives it. Everything else CI asks is asked here
# first, because a push that has to wait twenty minutes to be told about a
# stale golden is a push nobody waits for.
# The pre-push gate isolates the tree and not the build cache: it symlinks the developer's target/debug in, which is minutes per push and the reason every earlier "green" in this campaign was about artifacts compiled before the field they were meant to prove existed.
# CI is always cold and never had the problem; this is the one place that needs asking.
[tasks."build:release"]
description = "Build the njutest binary this commit would ship, which is what a smoke test of the action runs"
run = "cargo build --locked --release --bin njutest"

[tasks."check:cold"]
description = "Type-check the whole workspace into a target directory nothing else writes, so no earlier artifact can answer for this tree"
run = "cargo check --locked --workspace --all-targets --all-features"
env = { CARGO_TARGET_DIR = "target/cold" }

# What a push waits for, and what it does not.
#
# `test:slow` drives a real cargo against a fixture 453 times.
# It is 600 seconds that no concurrency shortens — three threads instead of two bought 16% — and CI runs the whole of it on four operating systems anyway.
# Paying for it again before every push bought early warning at ten minutes a push, and the failures that actually reached CI this campaign were platform and runner-environment ones this machine cannot see at any price.
# `mise run check:full` is the same list with it back in, for when a change is about the engine's own execution rather than about the code around it.
[tasks.check]
description = "Run every local gate a push waits for, the ones that answer quickest first"
# `build` is not here because `test:fast` runs `--all-targets`, which builds the same thing and then runs it.
# What a push compiles is twice over: once with clippy's fingerprints and once with the test harness's.
# Everything else reuses one of those.
shell = "bash -c"
run = """
set -uo pipefail
step() { "$@" || { status=$?; echo "check: '$*' failed with exit ${status}" >&2; exit "${status}"; }; }
step mise run fmt:check
step mise run lint
step mise run test:fast
step mise run test:doc
step mise run kani:verified
step mise run deny
step mise run audit
"""

# Every target triple this machine can read without the machine.
#
# Each of these compiles the whole workspace under its own fingerprint, so one source change costs a full pass apiece — that is what put the push gate over its budget with nothing left cold to blame.
# CI reads all three on their own runners, so a push learns from there rather than paying for it here.
[tasks."check:cross"]
description = "Type-check and lint the other platforms this machine can read"
run = ["mise run check:windows", "mise run lint:linux"]

# The release profile and the book, which a push does not wait for.
#
# `package` compiles the workspace again under a second profile and `doc` and `book` render it again; for a change to the engine core that is three more full passes on top of the debug build the tests already need.
# CI builds and installs the packages and the book on its own runners, so the question is answered there rather than twice here.
[tasks."check:release"]
description = "Build the documentation and the packages a release would ship"
run = ["mise run book", "mise run package"]

[tasks."check:full"]
description = "Everything a push waits for, and the passes CI also runs"
run = [
  "mise run check",
  "mise run check:cold",
  "mise run check:cross",
  "mise run check:release",
  "mise run test:slow",
]

[tasks.bench]
description = "Observe what every stage costs. Numbers, never gates"
shell = "bash -c"
run = """
set -euo pipefail
cargo bench -p rust-mutants --bench foundation -- "$@"
cargo bench -p rust-mutants --bench pipeline -- "$@"
cargo bench -p njutest --bench report -- "$@"
cargo bench -p njutest --bench evidence -- "$@"
"""

[tasks.dogfood]
description = "Point njutest at this workspace and read the verdict it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain "$@"
"""

[tasks."dogfood:audit"]
description = "Run njutest on this workspace and re-decide the recording it leaves"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain --trace "$@" || true
run="$(ls -dt reports/runs/*/ | head -1)"
trace="$(ls -dt .njutest/trace/*/ | head -1)"
echo "re-deciding ${run} from ${trace}"
cargo build --release -p xtask
./target/release/xtask proofaudit "${run}" --trace "${trace}"
"""

[tasks."dogfood:engine"]
description = "Point rust-mutants at this workspace and read the score it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@"
"""

[tasks."dogfood:engine:audit"]
description = "Run rust-mutants on its own engine and re-decide the report it wrote"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
cargo build --release -p xtask
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@" || true
run="$(ls -dt reports/mutation/*/ 2>/dev/null | head -1)"
if [ -z "${run}" ] || [ ! -f "${run}run-report-v1.json" ]; then
  echo "the run left no report to re-decide; read what it said above" >&2
  exit 2
fi
echo "re-deciding ${run} from its own recording"
./target/release/rust-mutants trace check --dir "${run}trace"
./target/release/xtask engine-audit "${run%/}" --trace "${run}trace" --sites --ledger .rust-mutants.toml
"""

[tasks."engine-audit"]
description = "Re-decide a stored engine run from its own rows, recording, and ledger"
run = "cargo run -q -p xtask -- engine-audit \"$@\""

[tasks."trace:check"]
description = "Say whether a recording is complete: it begins, it ends, and it lost nothing"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --workspace --all-features --bin rust-mutants
./target/debug/rust-mutants trace check "$@"
"""
