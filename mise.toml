# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Tool pins and the task runner. `justfile` is a thin wrapper over these.
# The cargo-tool versions mirror CI's install-action pins
# (.github/workflows/ci.yml) for local == CI parity — bump them together.
#
# A `cargo:` entry is built from source for the machine it is installed on. The
# plain ones are downloaded, and a release that ships no asset for an
# architecture leaves a binary that will not start on it: `committed` moved
# here after an operating system upgrade left its x86_64 download unable to
# exec, which stops every commit and says only "Bad CPU type in executable".

# Every `mise run` and every shell mise has activated compiles through the
# cache. Here rather than in `.cargo/config.toml` because a wrapper named
# there is one every checkout must have installed: a developer without it
# would get a build that will not start, where this gives them one that is
# merely as slow as it was before.
[env]
RUSTC_WRAPPER = "sccache"

[tools]
rust = "1.98.0"
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.48.0"
lefthook = "2.1.9"
"cargo:cargo-nextest" = "0.9.140"
"cargo:cargo-deny" = "0.19.7"
"cargo:cargo-llvm-cov" = "0.9.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:committed" = "1.1.11"
# A compilation cache, keyed on the content of what it is asked to compile.
#
# The toolchain suite copies a fixture into a temporary tree and starts a real
# cargo against it, three hundred times over thirty-eight fixtures, and each of
# those builds is isolated under its own target directory on purpose
# (ADR 0019): a test that picked up another test's instrumented artifact would
# be one measurement contaminating another, which is the defect this whole
# product is against. Isolation stays. What goes is recompiling the identical
# unit: 847ms cold, 402ms with this, with every target directory still its own.
sccache = "0.17.0"
mdbook = "0.5.4"

[tasks.bootstrap]
description = "Fetch the locked dependency graph and install the git hooks"
run = ["cargo fetch --locked", "lefthook install"]

[tasks.book]
description = "Build the documentation as a book, into target/book"
run = "mdbook build docs"

[tasks."book:serve"]
description = "Build the book and reload it in a browser as the pages change"
run = "mdbook serve docs"

[tasks.doctor]
description = "Report which development tools are present and whether their versions match the pins"
run = "bash scripts/doctor.sh"

[tasks.build]
description = "Build every crate and every target"
run = "cargo build --locked --workspace --all-targets"

[tasks.fmt]
description = "Format Rust and TOML"
run = ["cargo fmt --all", "taplo fmt"]
# taplo lists every file it read at INFO, which is seventy lines of noise in
# front of whatever it has to say.
env = { RUST_LOG = "warn" }

[tasks."fmt:check"]
description = "Check Rust and TOML formatting without rewriting files"
run = ["cargo fmt --all -- --check", "taplo fmt --check", "taplo lint"]
env = { RUST_LOG = "warn" }

[tasks.clippy]
description = "Lint every target with warnings denied"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.doc]
description = "Build rustdoc with broken links and warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --locked --workspace --no-deps --document-private-items"

[tasks.gates]
description = "Run the repository gates: seam ratchet, dependency direction, fixture conventions, release consistency"
run = [
  "cargo xtask devgates",
  "cargo xtask lints",
  "cargo xtask deps",
  "cargo xtask fixtures",
  "cargo xtask release-check",
]

[tasks.lint]
description = "Run clippy, rustdoc, the repository gates, the fuzz targets' own type check, spelling, TOML, and workflow linters"
depends = ["clippy", "doc", "gates", "fuzz:check"]
run = ["typos", "actionlint"]

# The suite is written for three platforms and run here on one. Most of what
# the other two answer differently needs their machine to find out, but code
# behind `#[cfg(windows)]` is not even read by this one's compiler, and a
# workspace that builds here can fail to build there on a lint. This asks for
# the reading without the machine, and needs the target's standard library:
# `rustup target add x86_64-pc-windows-msvc`.
[tasks."check:windows"]
description = "Type-check every target for Windows, so code only that platform compiles is compiled here too"
run = "cargo check --locked --workspace --all-targets --all-features --target x86_64-pc-windows-msvc"

[tasks."build:examples"]
description = "Build the scripted cargo the suite drives, which no test build produces"
# `cargo test --all-targets` builds an example as a test harness rather than as
# the program it is, so a suite that drives one has to ask for it plainly.
run = "cargo build --locked --examples -p rust-mutants"

[tasks."test:fast"]
description = "Run every test that starts no toolchain: the inner loop, seconds rather than a minute"
depends = ["build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'not binary(/^toolchain_/)'"
run_windows = "cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'not binary(/^toolchain_/)'"

# Each test in these binaries drives its own Cargo. CI adds `--test-threads 2`
# on top of this, because a hosted runner multiplies those build jobs into
# resource exhaustion; a developer's machine is not that machine, and the bound
# costs minutes there without changing which tests pass.
[tasks."exec-tax"]
description = "Report what it costs to run a newly written file, which is what a suite of fixture binaries pays per binary"
run = "bash scripts/exec-tax.sh"

[tasks."test:slow"]
description = "Run the suites that drive a real cargo against the fixture projects"
depends = ["exec-tax", "build:examples"]
run = "cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'binary(/^toolchain_/)'"
run_windows = "cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'binary(/^toolchain_/)'"

[tasks."test:doc"]
description = "Run the doctests, which nextest does not"
run = "cargo test --locked --workspace --doc"

[tasks.test]
description = "Run the complete suite: every target through nextest, then the doctests"
depends = ["test:fast", "test:slow", "test:doc"]

# The floors are the ones .github/workflows/ci.yml enforces, in the same order
# and with the same scoping. Never lower one; raise one when its suite earns it,
# in both places at once. The collection is that job's as well, down to the
# environment it exports and the two runs it splits the suite into: a gate that
# measured a different way is a gate that answers a different question, and the
# one that job asks is the one that has to be green.
[tasks.coverage]
description = "Measure region coverage with the ratchet CI enforces (never lower a floor)"
depends = ["exec-tax", "build:examples"]
shell = "bash -c"
run = """
set -euo pipefail
cargo clean
cargo llvm-cov clean --workspace
eval "$(cargo llvm-cov show-env --export-prefix)"
cargo build --locked --examples -p rust-mutants
cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'not binary(/^toolchain_/)'
cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail --test-threads 2 -E 'binary(/^toolchain_/)'
cargo llvm-cov report --summary-only --fail-under-regions 80
cargo llvm-cov report --summary-only --fail-under-regions 87 \
  --ignore-filename-regex 'crates/(rust-mutants-cli|njutest|njutest-cli|njutest-macros|njutest-devkit)/|xtask/|fuzz/'
cargo llvm-cov report --summary-only --fail-under-regions 85 \
  --ignore-filename-regex 'crates/(rust-mutants|njutest|njutest-cli|njutest-macros|njutest-devkit)/|xtask/|fuzz/'
cargo llvm-cov report --summary-only --fail-under-regions 80 \
  --ignore-filename-regex 'crates/|fuzz/'
"""

[tasks.package]
description = "Package every publishable member and write what a release would say it is made of"
run = [
  "cargo package --locked --workspace --no-verify --allow-dirty --exclude-lockfile",
  "cargo xtask sbom --output target/njutest.cdx.json",
]

[tasks.deny]
description = "Check licenses, advisories, bans, and sources"
run = "cargo deny --locked check"

[tasks.audit]
description = "Check the dependency graph against the RustSec advisory database"
run = "cargo audit --deny warnings"

[tasks."fuzz:check"]
description = "Type-check every cargo-fuzz target on the toolchain the workspace uses, so one cannot rot against an API change unnoticed"
dir = "fuzz"
run = "cargo check --locked --all-targets"

[tasks."fuzz:build"]
description = "Build every cargo-fuzz target (nightly, sanitizer) without running one"
dir = "fuzz"
run = "cargo +nightly fuzz build"

[tasks."fuzz:smoke"]
description = "Run every cargo-fuzz target briefly, the way CI does on a pull request"
dir = "fuzz"
shell = "bash -c"
run = """
set -euo pipefail
for target in $(cargo +nightly fuzz list); do
  echo "== $target"
  cargo +nightly fuzz run "$target" -- -runs=2000 -max_len=1024
done
"""

[tasks.mutants]
description = "Run cargo-mutants, the external mutation tester, against this workspace"
run = "cargo mutants --config .cargo/mutants.toml --workspace"

# The order is cheapest refusal first, which is not the order CI runs them in:
# CI runs the jobs at once and waits for all of them, and a person waits for
# each in turn. Formatting answers in seconds, rustdoc and clippy and the
# repository gates in tens of them, the suite in minutes. Two broken
# documentation links and two fuzz targets naming code that had been deleted
# all lived behind a three-minute suite, and every one of them is something
# `lint` says in seventeen seconds.
# What this leaves to CI is what this machine cannot answer: the suite on the
# other two platforms, the coverage ratchets (a second instrumented run of
# everything), the suite under the interpreter, and the composite action driven
# the way another repository drives it. Everything else CI asks is asked here
# first, because a push that has to wait twenty minutes to be told about a
# stale golden is a push nobody waits for.
[tasks.check]
description = "Run every local gate, the ones that answer quickest first"
run = [
  "mise run fmt:check",
  "mise run build",
  "mise run lint",
  "mise run test",
  "mise run deny",
  "mise run audit",
  "mise run book",
  "mise run package",
]

[tasks.bench]
description = "Observe what every stage costs. Numbers, never gates"
shell = "bash -c"
run = """
set -euo pipefail
cargo bench -p rust-mutants --bench foundation -- "$@"
cargo bench -p rust-mutants --bench pipeline -- "$@"
cargo bench -p njutest-cli --bench report -- "$@"
cargo bench -p njutest-cli --bench evidence -- "$@"
"""

[tasks.dogfood]
description = "Point njutest at this workspace and read the verdict it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain "$@"
"""

[tasks."dogfood:audit"]
description = "Run njutest on this workspace and re-decide the recording it leaves"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin njutest
./target/release/njutest verify --locked --offline --ui=plain --trace "$@" || true
run="$(ls -dt reports/runs/*/ | head -1)"
trace="$(ls -dt .njutest/trace/*/ | head -1)"
echo "re-deciding ${run} from ${trace}"
cargo build --release -p xtask
./target/release/xtask proofaudit "${run}" --trace "${trace}"
"""

[tasks."dogfood:engine"]
description = "Point rust-mutants at this workspace and read the score it reaches"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@"
"""

[tasks."dogfood:engine:audit"]
description = "Run rust-mutants on its own engine and re-decide the report it wrote"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --bin rust-mutants
cargo build --release -p xtask
./target/release/rust-mutants run --locked --offline --trace --jobs 4 "$@" || true
run="$(ls -dt reports/mutation/*/ 2>/dev/null | head -1)"
if [ -z "${run}" ] || [ ! -f "${run}run-report-v1.json" ]; then
  echo "the run left no report to re-decide; read what it said above" >&2
  exit 2
fi
echo "re-deciding ${run} from its own recording"
./target/release/rust-mutants trace check --dir "${run}trace"
./target/release/xtask engine-audit "${run%/}" --trace "${run}trace" --sites --ledger .rust-mutants.toml
"""

[tasks."engine-audit"]
description = "Re-decide a stored engine run from its own rows, recording, and ledger"
run = "cargo run -q -p xtask -- engine-audit \"$@\""

[tasks."trace:check"]
description = "Say whether a recording is complete: it begins, it ends, and it lost nothing"
shell = "bash -c"
run = """
set -euo pipefail
cargo build --bin rust-mutants
./target/debug/rust-mutants trace check "$@"
"""
