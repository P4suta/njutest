#
# cargo-mutants, the external mutation tester, against this repository: one of
# the two independent measurements of how strong this suite is (the other is
# `mise run dogfood`, mjutest and rust-mutants run on themselves). A survivor
# is a test to write or an acceptance to record with a reason.
name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo-mutants:
    name: cargo-mutants (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package: [rust-mutants, rust-mutants-cli, mjutest, mjutest-cli, mjutest-macros]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-mutants@27.1.0
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Run every mutant of the package
        env:
          PACKAGE: ${{ matrix.package }}
        run: >-
          cargo mutants --config .cargo/mutants.toml
          --package "$PACKAGE"
          --output "mutants.out-$PACKAGE"
      - name: Upload the mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-${{ matrix.package }}
          path: mutants.out-${{ matrix.package }}
          if-no-files-found: error
