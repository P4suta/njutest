#
# cargo-mutants, the external mutation tester, against this repository: one of the two independent measurements of how strong this suite is (the other is `mise run dogfood`, njutest and rust-mutants run on themselves).
# A survivor is a test to write or an acceptance to record with a reason.
name: mutation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: Immutable release candidate commit.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ inputs.source || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  whole:
    name: cargo-mutants (whole workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- Exercise the checked-out candidate's action.
        with:
          tools: cargo-mutants@27.1.0
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Run every mutant of the workspace
        run: >-
          cargo mutants --config .cargo/mutants.toml
          --workspace
          --copy-vcs=true
          --output mutants.out
      - name: Upload the mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-whole
          path: mutants.out
          if-no-files-found: error
          retention-days: 7
