#
# cargo-mutants, the external mutation tester, against this repository: one of the two independent measurements of how strong this suite is (the other is `mise run dogfood`, njutest and rust-mutants run on themselves).
# A survivor is a test to write or an acceptance to record with a reason.
name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  whole:
    name: cargo-mutants (whole workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-mutants@27.1.0
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Run every mutant of the workspace
        run: >-
          cargo mutants --config .cargo/mutants.toml
          --workspace
          --copy-vcs=true
          --output mutants.out
      - name: Upload the mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-whole
          path: mutants.out
          if-no-files-found: error
