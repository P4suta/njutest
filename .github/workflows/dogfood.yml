#
# rust-mutants against its own engine in one job, through the action another repository uses, and then an independent re-decision of what it reported.
# This is the second of the two measurements of how strong this suite is; the other is cargo-mutants (mutation.yml).
# A survivor the ledger does not accept fails the job.
name: dogfood

on:
  workflow_dispatch:
    inputs:
      include:
        description: The files to mutate, as a glob. Empty means the ledger's own selection.
        required: false
        type: string
      tier:
        description: Which tier of operators to apply.
        required: false
        default: balanced
        type: choice
        options: [balanced, strong, all]
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  whole:
    name: the whole engine, in one job
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked
      - name: Build the engine and the gates, and put the engine on the path
        run: |
          cargo build --locked --release --bin rust-mutants -p xtask
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      # The store the action restores and saves is what makes this one job: a run reads back every answer the last one established that still holds, and a run the clock ends keeps what it established for the next.
      # A survivor is the audit's business, not this step's, so its verdict is read below rather than failing here.
      - name: Measure the whole catalog
        id: mutation
        continue-on-error: true
        uses: ./.github/actions/rust-mutants
        with:
          args: >-
            --locked --tier ${{ inputs.tier || 'balanced' }} --trace
            ${{ inputs.include && format('--include {0}', inputs.include) || '' }}
          changed-from: ""
          upload-sarif: "false"
      - name: Say whether the recording is complete, and re-decide the run against the ledger
        env:
          VERDICT: ${{ steps.mutation.outputs.verdict }}
          REPORT: ${{ steps.mutation.outputs.report }}
        run: |
          set -euo pipefail
          case "$VERDICT" in
            detected | found | interrupted) ;;
            *)
              echo "the run concluded '$VERDICT', which is not a measurement to audit"
              exit 1
              ;;
          esac
          run=$(dirname "$REPORT")
          rust-mutants trace check --dir "$run/trace"
          xtask engine-audit "$run" --trace "$run/trace" --sites --ledger .rust-mutants.toml
          cp "$REPORT" whole.json
          if [ "$VERDICT" = interrupted ]; then
            echo "the run was ended by the clock; the next one continues from the store this one kept" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Say what moved since the last complete run
        env:
          GH_TOKEN: ${{ github.token }}
        # A run that reports what a previous one did not is a change somebody made.
        # There is nothing to compare on the first run of a workflow, and a diff against nothing is not a failure; a diff that cannot be read is.
        run: |
          set -euo pipefail
          previous=$(gh run list --workflow dogfood.yml --status success \
            --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$previous" ]; then
            echo "no earlier run of this workflow to compare with" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf before
          gh run download "$previous" --name dogfood-whole --dir before
          {
            echo "## What moved since run $previous"
            echo
            echo '```'
            xtask report-diff before/whole.json whole.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dogfood-whole
          path: |
            whole.json
            reports/mutation
          if-no-files-found: error
