# What a pull request adds to the dependency graph, before it is merged.
# `cargo deny` answers the same question about the graph that is already here;
# this answers it about the change, and says so on the pull request itself.
name: Dependency review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review the change
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: true
          comment-summary-in-pr: on-failure
