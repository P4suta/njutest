name: dependabot-auto-merge

# A dependency bump is a change whose review is the pipeline: the whole suite
# on three platforms, the lint set, the gates, the licence and advisory checks.
# A person reading the diff afterwards adds nothing the gate did not already
# say, and a queue of bumps waiting on a hand is a queue of advisories nobody
# has taken. So the merge is asked for as the pull request opens, and GitHub
# performs it when `ci-success` passes and not before.
#
# `pull_request_target` rather than `pull_request`, because a workflow started
# by dependabot gets a read-only token and no secrets, and enabling a merge
# needs to write. It runs in the base repository's context with the base
# repository's code: nothing here checks out the branch under review, which is
# the one thing that would make the elevated token reachable from it.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ask for the merge the gate decides
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PULL_REQUEST}"
