name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue holds a pull request until `ci-success` reports on the merge group it builds.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A pull request is asked again with every push to it, and the answer to the question before is not one anybody wanted.
# `main` is different: its run is the only thing that says the branch everything merges into is green, and one merge arriving while the last is still measuring would leave that unsaid.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The suites drive a real cargo against the fixture projects; nothing may reach a registry from inside a test.
  CARGO_NET_OFFLINE: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Each platform answers for itself.
      # `fail-fast: true` read "this commit is red" as "stop asking", and the platforms it stopped asking were the ones nothing else can answer for: a Windows failure cancelled both macOS jobs on four consecutive pushes, so a macOS fix went four rounds without ever being run.
      # The cost of the other three finishing is minutes of runner time.
      # The cost of not knowing is a round trip per platform, serialised.
      #
      # Two macOS versions on purpose.
      # `macos-26` is the newest macOS image GitHub publishes, which is not the newest macOS: the machine this is developed on runs 27, and no runner image answers for it.
      # So the newest row is the closest CI can stand to where the code is written, and the gap is a reason to keep reading a macOS failure rather than a reason to assume the local gate saw it.
      # `macos-15` is the oldest still supported, and it is not ballast: it is where `proc_listpgrppids` reports an empty process group after a timeout, which the supervisor read as a failure and turned into `abort()`.
      # The newer kernel still listed the waitable leader, so the machine that wrote the code could never have seen it.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          tools: cargo-nextest@0.9.140
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        shell: bash
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      # `cargo test --all-targets` builds an example as a test harness, not as the program it is, and part of this suite drives a scripted `cargo` that is one.
      # Building it plainly is what makes those tests able to run.
      - name: Build the scripted toolchain the suite drives
        shell: bash
        run: cargo build --locked --examples --workspace --all-features --profile test
      # `shell: bash` rather than the default, which is PowerShell on Windows:
      # a native command that fails there does not stop the script, so the suite below ran on after the first half had already failed and the step's status became the second half's.
      # A failing test took the job's forty-five minute timeout to be reported, and would have been reported as a pass had the second half succeeded.
      - name: Test every target
        shell: bash
        run: |
          cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail -E 'not binary(/^toolchain_/)'
          # Each test in these binaries drives its own Cargo. Two outer tests
          # keep hosted runners busy without multiplying their build jobs into
          # resource exhaustion; the ordinary suite above remains fully parallel.
          cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --status-level fail --test-threads 2 -E 'binary(/^toolchain_/)'
      - name: Doctests
        shell: bash
        run: cargo test --locked --workspace --all-features --doc

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          tools: committed@1.1.11
          mise-tools: taplo typos actionlint
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: doc
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: repository gates (seam ratchet, dependency direction, fixtures, release consistency)
        run: cargo xtask all
      - name: fuzz targets satisfy the root Clippy policy
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo xtask fuzz-clippy
      - name: typos
        run: typos
      - name: taplo
        run: taplo fmt --check && taplo lint
      - name: actionlint
        run: actionlint
      # Dependabot writes the body of a commit as the changelog it copied, and neither it nor anybody here wraps that at a hundred columns.
      # The rule is about a message somebody wrote, and what lands on `main` from one of those pull requests is the squash subject, which is its own `chore:` line and conventional already.
      - name: committed (pull request commits)
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          committed "origin/${BASE_REF}..${HEAD_SHA}"

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The container has its own Cargo home, so the host's fetch cannot seed the index it resolves against.
      CARGO_NET_OFFLINE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny@0.19.7
      - run: cargo deny --locked --all-features check

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
        env:
          CARGO_NET_OFFLINE: "false"

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          tools: cargo-llvm-cov@0.9.0, cargo-nextest@0.9.140
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      # `nextest` builds the test targets and nothing else, and part of this suite drives a scripted `cargo` that lives in an example.
      # Building it takes the same environment the instrumented run uses, which is what `show-env` is for.
      - name: Collect coverage (run the suite once)
        run: |
          set -euo pipefail
          # The instrumented build lands in the ordinary `target/`, which the
          # cache restored, and `report` reads the coverage mapping of every
          # object file it finds there — including the ones built from a source
          # version this commit no longer has. A file this branch changed then
          # appears twice: once as the copy the tests ran, once as a copy
          # nothing ran, and the floor is measured against a crate that is half
          # phantom. On one pull request `snapshot/mod.rs` read 2604 regions and
          # 42% where the same file on `main` read 1291 and 84%.
          #
          # `llvm-cov clean` removes the profiles and this run's own artifacts;
          # what has to go is everything the cache brought. A measurement that
          # gates a merge is worth the rebuild.
          cargo clean
          cargo llvm-cov clean --workspace
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/coverage-env.sh"
          . "$RUNNER_TEMP/coverage-env.sh"
          # Every step after this one is its own shell, and `report` guesses a
          # directory of its own that is not the one these runs write to:
          # `not found *.profraw files in .../target/llvm-cov-target`, with the
          # profiles sitting in `target` all along. The steps are told where.
          echo "CARGO_LLVM_COV_TARGET_DIR=$CARGO_LLVM_COV_TARGET_DIR" >> "$GITHUB_ENV"
          cargo build --locked --examples --workspace --all-features --profile test
          cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast -E 'not binary(/^toolchain_/)'
          # Coverage makes every nested build heavier. Bound only the suites
          # that start those builds, preserving full parallelism everywhere else.
          cargo nextest run --locked --workspace --all-targets --all-features --no-fail-fast --test-threads 2 -E 'binary(/^toolchain_/)'
      - name: Report (lcov + HTML + summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only
      # Never lower; raise one when its suite earns it.
      # The floors are a little under what the suite reaches today, so an ordinary change has room and a change that drops a whole area does not.
      - name: Ratchet the workspace
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 80
          --ignore-filename-regex 'compiler-surfaces/'
      - name: Ratchet rust-mutants
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 87
          --ignore-filename-regex 'crates/(rust-mutants-cli|njutest|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
      - name: Ratchet rust-mutants-cli
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 83
          --ignore-filename-regex 'crates/(rust-mutants|njutest|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
      - name: Ratchet njutest
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 81
          --ignore-filename-regex 'crates/(rust-mutants|rust-mutants-cli|njutest-macros|njutest-devkit)/|xtask/|fuzz/|compiler-surfaces/'
      - name: Ratchet xtask
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 80
          --ignore-filename-regex 'crates/|fuzz/|compiler-surfaces/'
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  package-install:
    name: package-install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Every publishable member packages
        run: cargo package --locked --workspace --no-verify --allow-dirty --exclude-lockfile
      - name: The binaries install from this tree
        run: |
          cargo install --locked --path crates/njutest --root "${RUNNER_TEMP}/install"
          cargo install --locked --path crates/rust-mutants-cli --root "${RUNNER_TEMP}/install"
          "${RUNNER_TEMP}/install/bin/njutest" --version
          "${RUNNER_TEMP}/install/bin/rust-mutants" --version
      - name: And cargo finds them by the name it looks for
        run: |
          export PATH="${RUNNER_TEMP}/install/bin:${PATH}"
          cargo njutest --version
          cargo rust-mutants --version
      - name: What a release would say it is made of
        run: cargo xtask sbom --output "${RUNNER_TEMP}/njutest.cdx.json"

  book:
    name: book
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          mise-tools: mdbook
      - name: build the book, which refuses a summary naming a page nobody holds
        run: mdbook build docs

  soundness:
    name: soundness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install the interpreter the deep-v1 contract promises
        run: rustup toolchain install nightly --component miri --profile minimal
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Build the njutest this commit would ship
        run: mise run build:release
      # Every other job runs on a machine with no Miri, where the whole of deep-v1 is the refusal NJ7001.
      # This is the only place the promise itself is kept: the suite interpreted, and what the interpreter would not follow stated rather than passed over.
      - name: Verify a fixture under the contract that promises interpretation
        run: |
          cp -r fixtures/fixture-baseline "$RUNNER_TEMP/interpreted"
          printf 'version = 1\ncontract = "deep-v1"\n' > "$RUNNER_TEMP/interpreted/.njutest.toml"
          ./target/release/njutest verify \
            --directory "$RUNNER_TEMP/interpreted" --offline --locked --no-cache --ui=plain \
            | tee "$RUNNER_TEMP/interpreted.out" \
            || test "${PIPESTATUS[0]}" -eq 1
      # The run says where it wrote, so this never has to know the layout.
      - name: The run says it interpreted the suite
        run: |
          written=$(awk -F'\t' '$1 == "REPORT" { print $2 }' "$RUNNER_TEMP/interpreted.out")
          test -n "$written" || { echo "the run said nothing about where it wrote"; exit 1; }
          jq --exit-status '
              .report.contract == "deep-v1"
              and ([.report.builds[].parts[].accounting.soundness.executed] | length > 0 and all)
            ' "$RUNNER_TEMP/interpreted/$written"

  kani-verified:
    name: kani-verified
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Install the exact verifier and backend
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo install --locked kani-verifier --version '=0.68.0'
          cargo kani setup
      - name: Prove the production mutation outcome laws
        run: mise run kani:laws
      - name: Exercise generated harnesses and the retained-result protocol with real Kani
        run: mise run kani:verified

  action-smoke:
    name: action-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Build the njutest this commit would ship and put it on the path
        run: |
          cargo build --locked --release --bin njutest
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Run the action the way another repository would
        id: njutest
        uses: ./.github/actions/njutest
        with:
          working-directory: fixtures/fixture-assured
          args: --offline --locked --ui=plain
          upload-sarif: "false"
      - name: The verdict the action reports is the one the run reached
        env:
          VERDICT: ${{ steps.njutest.outputs.verdict }}
          REPORT: ${{ steps.njutest.outputs.report }}
        run: |
          test "$VERDICT" = ASSURED || { echo "verdict was '$VERDICT'"; exit 1; }
          test -f "fixtures/fixture-assured/$REPORT"

  ci-success:
    name: ci-success
    if: always()
    needs:
      [test, lint, deny, audit, coverage, package-install, book, soundness, kani-verified, action-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gating job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "all CI gates passed"
          else
            jq . <<<"$NEEDS"
            exit 1
          fi
