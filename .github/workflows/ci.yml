name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The suites drive a real cargo against the fixture projects; nothing may
  # reach a registry from inside a test.
  CARGO_NET_OFFLINE: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest@0.9.140
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Test every target
        run: cargo nextest run --locked --workspace --all-targets --all-features --status-level fail
      - name: Doctests
        run: cargo test --locked --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          tools: taplo-cli@0.10.0
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: doc
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: repository gates (seam ratchet, dependency direction, fixtures, release consistency)
        run: cargo xtask all
      - name: typos
        uses: crate-ci/typos@3e8e1dbf18c56a9ed625484ca941497c73e7da2c # v1.47.2
      - name: taplo
        run: taplo fmt --check && taplo lint
      - name: install actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: committed (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL https://github.com/crate-ci/committed/releases/download/v1.1.11/committed-v1.1.11-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" ./committed
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          "$RUNNER_TEMP/committed" "$BASE_SHA..$HEAD_SHA" --no-merge-commit

  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
        env:
          CARGO_NET_OFFLINE: "false"

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          tools: cargo-llvm-cov@0.9.0, cargo-nextest@0.9.140
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      # `nextest` builds the test targets and nothing else, and part of this
      # suite drives a scripted `cargo` that lives in an example. Building it
      # takes the same environment the instrumented run uses, which is what
      # `show-env` is for.
      - name: Collect coverage (run the suite once)
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/coverage-env.sh"
          . "$RUNNER_TEMP/coverage-env.sh"
          cargo build --locked --examples -p rust-mutants
          cargo nextest run --locked --workspace --all-targets --all-features
      - name: Report (lcov + HTML + summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          cargo llvm-cov report --summary-only
      # Never lower; raise one when its suite earns it. The floors are a
      # little under what the suite reaches today, so an ordinary change has
      # room and a change that drops a whole area does not.
      - name: Ratchet the workspace
        run: cargo llvm-cov report --summary-only --fail-under-regions 80
      - name: Ratchet rust-mutants
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 87
          --ignore-filename-regex 'crates/(rust-mutants-cli|mjutest|mjutest-cli|mjutest-macros|mjutest-devkit)/|xtask/|fuzz/'
      - name: Ratchet rust-mutants-cli
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 85
          --ignore-filename-regex 'crates/(rust-mutants|mjutest|mjutest-cli|mjutest-macros|mjutest-devkit)/|xtask/|fuzz/'
      - name: Ratchet xtask
        run: >-
          cargo llvm-cov report --summary-only --fail-under-regions 80
          --ignore-filename-regex 'crates/|fuzz/'
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          if-no-files-found: error

  package-install:
    name: package-install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Fetch the locked dependency graph
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - name: Every publishable member packages
        run: cargo package --locked --workspace --no-verify --allow-dirty
      - name: The binaries install from this tree
        run: |
          cargo install --locked --path crates/mjutest-cli --root "${RUNNER_TEMP}/install"
          cargo install --locked --path crates/rust-mutants-cli --root "${RUNNER_TEMP}/install"
          "${RUNNER_TEMP}/install/bin/mjutest" --version
          "${RUNNER_TEMP}/install/bin/rust-mutants" --version
      - name: What a release would say it is made of
        run: cargo xtask sbom --output "${RUNNER_TEMP}/mjutest.cdx.json"

  ci-success:
    name: ci-success
    if: always()
    needs: [test, lint, deny, audit, coverage, package-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gating job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "all CI gates passed"
          else
            jq . <<<"$NEEDS"
            exit 1
          fi
