name: release-please

# Asked for rather than automatic. Opening the release pull request needs a
# permission this repository withholds from Actions, so every push to `main`
# started this and failed:
#
#     release-please failed: GitHub Actions is not permitted to create or
#     approve pull requests
#
# A branch that is red for a job nobody wanted is a branch whose colour says
# nothing. The release train is still here and still the only way a version is
# cut; it is started when somebody means to cut one, which is also when the
# permission it needs is worth granting.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
