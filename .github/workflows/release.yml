name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, which must already exist.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- Exercise the checked-out candidate's action.
      # Whether each binary says the version is asked where each binary is built: `cargo xtask bundle` refuses one that does not, on every platform.
      - name: The tag and the manifests must name one version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo xtask release-check
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq --raw-output '.packages[] | select(.name == "njutest") | .version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "the tag ${TAG} does not name version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  verify:
    name: verify release candidate
    needs: [check]
    permissions:
      actions: read # Read earlier dogfood artifacts.
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 requires workspace-relative workflows.
    with:
      source: ${{ needs.check.outputs.source }}

  artifacts:
    name: artifacts (${{ matrix.os }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- Exercise the checked-out candidate's action.
      # Which binaries, where each goes, and what goes beside them are what the manifests say, read by the one command; this workflow names none of them.
      - name: Build the binaries the manifests declare and bundle them where binstall reads them
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask bundle --target "${TARGET}" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: sbom
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository] -- Exercise the checked-out candidate's action.
      - name: Write what the release is made of
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          cargo xtask sbom --output "dist/njutest-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [check, verify, artifacts, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # Publish the verified release artifacts.
      id-token: write # Authenticate build provenance.
      attestations: write # Attach build provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Say what was built and from what
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            --draft \
            dist/*
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
