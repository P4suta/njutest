# CodeQL over the two languages this repository is written in: Rust, and the workflows themselves.
# `build-mode: none` is what CodeQL's Rust support takes;
# nothing here compiles the workspace a second time.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.1/codeql-bundle-linux64.tar.zst

      - name: Scan
        id: scan
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: Refuse security findings
        env:
          SARIF_DIRECTORY: ${{ steps.scan.outputs.sarif-output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = list(Path(os.environ["SARIF_DIRECTORY"]).glob("*.sarif"))
          if not reports:
              raise SystemExit("CodeQL produced no SARIF report")
          findings = sum(
              len(run["results"])
              for report in reports
              for run in json.loads(report.read_text())["runs"]
          )
          print(f"CodeQL: {findings} findings across {len(reports)} reports")
          raise SystemExit(1 if findings else 0)
          PY

  required:
    name: CodeQL required
    # One name a branch protection rule can require, whatever the matrix grows to: a matrix job that is skipped reports success on its own.
    if: always()
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify scan
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
