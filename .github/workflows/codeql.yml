# CodeQL over the two languages this repository is written in: Rust, and the workflows themselves.
# `build-mode: none` is what CodeQL's Rust support takes;
# nothing here compiles the workspace a second time.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue holds a pull request until `CodeQL required` reports on the merge group it builds.
  merge_group:
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Scan
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

  required:
    name: CodeQL required
    # One name a branch protection rule can require, whatever the matrix grows to: a matrix job that is skipped reports success on its own.
    if: always()
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify scan
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYZE_RESULT" = success
