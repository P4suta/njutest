#
# cargo-fuzz against the fail-closed parsers and byte transformations of both products (fuzz/README.md lists the targets and their properties).
# A crash is uploaded as an artifact and is a test to write, never an input to blame.
#
name: fuzz

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        description: Immutable release candidate commit.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ inputs.source || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - flatten
          - trace_reader
          - glob
          - splice
          - normalize_path
          - discover_file
          - annotations
          - config
          - coverage_export
          - libtest_summary
          - report_document
          - model_result
          - carried_answers
          - offered_candidates
          - engine_config
          - run_report
          - engine_coverage_export
          - depinfo
          - cargo_config
          - libtest_lines
          - cargo_messages
          - cargo_metadata
          - touch_log
          - duration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Read the shared toolchain pins
        id: toolchains
        run: |
          python3 scripts/toolchain.py --output >> "$GITHUB_OUTPUT"
          python3 scripts/toolchain.py --env >> "$GITHUB_ENV"
      - name: Install the pinned fuzzing toolchain
        run: rustup toolchain install "$NJUTEST_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fetch the locked dependency graph
        working-directory: fuzz
        run: cargo +"$NJUTEST_NIGHTLY" fetch --locked
      - name: Build
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo +"$NJUTEST_NIGHTLY" fuzz build --target x86_64-unknown-linux-gnu "$FUZZ_TARGET"
      - name: Run
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          budget="-runs=5000"
          bash ../scripts/seed-fuzz-corpus.sh "$FUZZ_TARGET"
          cargo +"$NJUTEST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" -- "$budget" -seed=1 -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
