#
# cargo-fuzz against the fail-closed parsers and byte transformations of both
# products (fuzz/README.md lists the targets and their properties).
# A pull request that touches either of them or the harness gets a short smoke;
# the weekly run spends real time. A crash is uploaded as an artifact and is
# a test to write, never an input to blame.
#
# This file is not in that list. What a change to it usually is, is the digest
# of an action moving: twenty-three targets built and fuzzed to find out that
# nothing about them changed. `actionlint` reads this file on every pull
# request, and the weekly run is what says the targets still work.
name: fuzz

on:
  pull_request:
    paths:
      - "crates/rust-mutants/**"
      - "crates/njutest-cli/**"
      - "fuzz/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The repository pins stable in rust-toolchain.toml. Make the fuzz
      # process select the nightly that the action below installs.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - flatten
          - trace_reader
          - glob
          - splice
          - normalize_path
          - discover_file
          - annotations
          - config
          - coverage_export
          - libtest_summary
          - report_document
          - carried_answers
          - offered_candidates
          - engine_config
          - run_report
          - engine_coverage_export
          - depinfo
          - cargo_config
          - libtest_lines
          - cargo_messages
          - cargo_metadata
          - touch_log
          - duration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fuzzing needs nightly for the sanitizer. Each rust-toolchain action
      # branch bakes in its toolchain, so pin the nightly branch itself.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fetch the locked dependency graph
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Build
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz build --target x86_64-unknown-linux-gnu "$FUZZ_TARGET"
      - name: Run
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            budget="-runs=5000"
          else
            budget="-max_total_time=1500"
          fi
          if [ -d "fuzz/seeds/$FUZZ_TARGET" ]; then
            mkdir -p "fuzz/corpus/$FUZZ_TARGET"
            cp "fuzz/seeds/$FUZZ_TARGET/"* "fuzz/corpus/$FUZZ_TARGET/"
          fi
          cargo fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" -- "$budget" -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
