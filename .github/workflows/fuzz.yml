#
# cargo-fuzz against the fail-closed parsers and byte transformations of both
# products (fuzz/README.md lists the targets and their properties).
# A crash is uploaded as an artifact and is a test to write, never an input to
# blame.
#
# This runs weekly and on request, and never on a pull request. Twenty-three
# targets built on nightly and given five thousand executions each is
# twenty-three machines spending a quarter of an hour to search a space that
# wants hours, and none of it gates anything: `ci-success` does not wait for
# it, so a crash it found could not have stopped a merge anyway. What guards a
# pull request is that the targets still compile against the API they fuzz,
# which `lint` answers in seconds as `mise run fuzz:clippy`.
# What finds a crash is time, which the weekly run spends and `mise run fuzz:smoke` spends on the machine of whoever is changing a parser.
name: fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The repository pins stable in rust-toolchain.toml. Make the fuzz
      # process select the nightly that the action below installs.
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target:
          - flatten
          - trace_reader
          - glob
          - splice
          - normalize_path
          - discover_file
          - annotations
          - config
          - coverage_export
          - libtest_summary
          - report_document
          - model_result
          - carried_answers
          - offered_candidates
          - engine_config
          - run_report
          - engine_coverage_export
          - depinfo
          - cargo_config
          - libtest_lines
          - cargo_messages
          - cargo_metadata
          - touch_log
          - duration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fuzzing needs nightly for the sanitizer. Each rust-toolchain action
      # branch bakes in its toolchain, so pin the nightly branch itself.
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly branch
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fetch the locked dependency graph
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Build
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz build --target x86_64-unknown-linux-gnu "$FUZZ_TARGET"
      - name: Run
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          budget="-max_total_time=1500"
          bash ../scripts/seed-fuzz-corpus.sh "$FUZZ_TARGET"
          cargo fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" -- "$budget" -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
