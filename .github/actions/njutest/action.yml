name: njutest
description: Run njutest against this repository and hand its findings to code scanning.

inputs:
  version:
    description: 'The njutest release to install, without the leading v. Defaults to the latest.'
    required: false
    default: ""
  args:
    description: 'Arguments for `njutest verify`, e.g. "--package core --offline".'
    required: false
    default: ""
  upload-sarif:
    description: 'Upload the SARIF projection to code scanning. Needs `security-events: write`.'
    required: false
    default: "true"
  working-directory:
    description: 'The workspace to verify. The checkout root by default.'
    required: false
    default: "."

outputs:
  verdict:
    description: 'What the run concluded: ASSURED, CHANGE_ASSURED, SCOPE_ASSURED, DEFECT, INSUFFICIENT, PARTIAL, or ERROR.'
    value: ${{ steps.verify.outputs.verdict }}
  report:
    description: 'The path of the report the run wrote.'
    value: ${{ steps.verify.outputs.report }}

runs:
  using: composite
  steps:
    # A workflow that already put njutest on the path has said which one it
    # wants: a build of the commit under test, a cached binary, a package from
    # somewhere else. Installing over it would answer a question nobody asked
    # and would leave this action untestable before its first release, since
    # every step after it needs a binary that only a release provides.
    - name: Decide whether njutest has to be installed
      id: present
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "${VERSION}" ] && command -v njutest >/dev/null 2>&1; then
          echo "install=false" >> "${GITHUB_OUTPUT}"
          echo "using $(command -v njutest)"
        else
          echo "install=true" >> "${GITHUB_OUTPUT}"
        fi
    - if: steps.present.outputs.install == 'true'
      uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
      with:
        tool: cargo-binstall
    - name: Install njutest
      if: steps.present.outputs.install == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "${VERSION}" ]; then
          cargo binstall --no-confirm --locked "njutest@${VERSION}"
        else
          cargo binstall --no-confirm --locked njutest
        fi
    # A verdict is not a failure of the step: a DEFECT is what the run is for,
    # and swallowing the exit code here would hide it. The status is kept and
    # re-raised after the findings have been uploaded, so a person reads them
    # in code scanning rather than in a log.
    - name: Verify
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        # shellcheck disable=SC2086
        njutest verify ${ARGS} | tee njutest-verify.out
        status=${PIPESTATUS[0]}
        verdict=$(awk -F'\t' '$1 == "VERDICT" { print $2 }' njutest-verify.out)
        # The run says where it wrote, so this never has to know the layout:
        # `[reports] directory` is the project's to choose.
        report=$(awk -F'\t' '$1 == "REPORT" { print $2 }' njutest-verify.out)
        if [ -n "${report}" ]; then
          {
            echo "report=${report}"
            echo "sarif=${report%njutest-assurance-report-v2.json}njutest-assurance-report-v2.sarif"
          } >> "${GITHUB_OUTPUT}"
        fi
        {
          echo "verdict=${verdict}"
          echo "status=${status}"
        } >> "${GITHUB_OUTPUT}"
        rm -f njutest-verify.out
        exit 0
    - name: Upload the findings to code scanning
      if: inputs.upload-sarif == 'true' && steps.verify.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ steps.verify.outputs.sarif }}
        category: njutest
    - name: Exit with what the run concluded
      shell: bash
      env:
        STATUS: ${{ steps.verify.outputs.status }}
      run: exit "${STATUS}"
