name: setup-rust
description: Pinned Rust toolchain (from rust-toolchain.toml) + mold + mise + cargo cache (+ optional tools), shared by every CI job.

inputs:
  components:
    description: 'Comma-separated rustup components in addition to rust-toolchain.toml, e.g. "rustfmt, clippy".'
    required: false
    default: ""
  targets:
    description: 'Comma-separated rustup targets.'
    required: false
    default: ""
  tools:
    description: 'Comma-separated cargo tools for taiki-e/install-action, e.g. "cargo-nextest@0.9.140". Pin to mise.toml.'
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No `toolchain` input: the action reads rust-toolchain.toml, which is the one place the version is pinned.
    - uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # stable branch, toolchain from rust-toolchain.toml
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
    # Three jobs call `mise run …` so that the pipeline and a developer's
    # machine run the same task rather than two spellings of one; none of them
    # installed mise, and `soundness` failed with `mise: command not found`.
    # It goes here rather than in those jobs so a job added later cannot forget.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.12
        install: false
        cache: true
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
    - if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
      with:
        tool: ${{ inputs.tools }}
