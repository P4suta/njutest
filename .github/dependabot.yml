version: 2
updates:
  # Both lock files, in one pull request.
  # `fuzz/` is a workspace of its own that path-depends on the crates here, so a bump in this one moves versions in that one's lock too.
  # Left to itself it would be a pull request that cannot pass:
  #
  #     error: cannot update the lock file fuzz/Cargo.lock because --locked
  #     was passed to prevent this
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    groups:
      rust-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
    # `dtolnay/rust-toolchain@<ref>`: the toolchain comes from rust-toolchain.toml, and the action ref is pinned by hand.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]
