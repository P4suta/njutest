# doc_markdown: domain terms that need no backticks in docs.
doc-valid-idents = [
  "..",
  "GitHub",
  "UTF-8",
  "UTF-16",
  "SARIF",
  "JUnit",
  "JSON",
  "TOML",
  "RFC3339",
  "LLVM",
  "OCaml",
  "Stryker",
  "Miri",
  "ThreadSanitizer",
]

# Complexity thresholds — tighter than clippy's defaults.
too-many-arguments-threshold = 4
too-many-lines-threshold = 80
cognitive-complexity-threshold = 18
type-complexity-threshold = 250
max-fn-params-bools = 1
enum-variant-name-threshold = 2
enum-variant-size-threshold = 256

msrv = "1.98.0"

# Tests may unwrap/expect/panic; production code stays strict.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Pre-1.0: API is not export-stable yet.
avoid-breaking-exported-api = false

pass-by-value-size-limit = 128

disallowed-methods = [
  { path = "std::mem::forget", reason = "leaks destructors; use `ManuallyDrop` or explicit drop" },
  { path = "std::env::set_var", reason = "races with other threads; wire the value through Options instead" },
  { path = "std::env::remove_var", reason = "see std::env::set_var" },
  { path = "std::process::exit", reason = "bypasses destructors; return an ExitCode from main. The generated mutant runtime is the one exception and is not this crate's source" },
  { path = "core::result::Result::ok", reason = "turns a failure into absence; match, inspect, or report the error instead" },
  { path = "core::result::Result::unwrap_or", reason = "turns a failure into a stand-in; report the error instead" },
  { path = "core::result::Result::unwrap_or_default", reason = "turns a failure into an empty value; report the error instead" },
  { path = "core::result::Result::map_or", reason = "hides the error policy in a closure argument; use an exhaustive match" },
  { path = "core::result::Result::map_or_else", reason = "hides the error policy in a closure argument; use an exhaustive match" },
  { path = "core::result::Result::or", reason = "turns a failure into a stand-in; report the error instead" },
  { path = "core::result::Result::or_else", reason = "turns a failure into another attempt with the first one unreported; match and say what happened to it" },
  { path = "std::path::Path::exists", reason = "erases the difference between absent and unreadable; try the operation and match its error" },
  { path = "std::path::Path::is_file", reason = "erases the difference between absent and unreadable; try the operation and match its error" },
  { path = "std::path::Path::is_dir", reason = "erases the difference between absent and unreadable; try the operation and match its error" },
  { path = "syn::parse_str", reason = "lexes into the location map of the calling thread; shipped code reads Rust through rust_mutants::parsing, and code that measures through njutest_devkit::lexed or xtask's lexed" },
  { path = "syn::parse_file", reason = "see syn::parse_str" },
  { path = "syn::parse::Parser::parse_str", reason = "see syn::parse_str" },
  { path = "syn::LitStr::parse", reason = "lexes a literal's value again; see syn::parse_str" },
  { path = "syn::LitStr::parse_with", reason = "lexes a literal's value again; see syn::parse_str" },
  { path = "syn::LitInt::new", reason = "lexes its text; see syn::parse_str" },
  { path = "syn::LitFloat::new", reason = "lexes its text; see syn::parse_str" },
]

disallowed-macros = [
  { path = "quote::quote", reason = "lexes every literal it quotes into the location map of the calling thread; only the macros crate, which is handed the compiler's own tokens, quotes" },
  { path = "quote::quote_spanned", reason = "see quote::quote" },
  { path = "syn::parse_quote", allow-invalid = true, reason = "see quote::quote; syn declares it only with its printing feature, which only the macros crate turns on" },
  { path = "syn::parse_quote_spanned", allow-invalid = true, reason = "see syn::parse_quote" },
]

disallowed-types = [
  { path = "once_cell::sync::Lazy", reason = "use std::sync::LazyLock" },
  { path = "once_cell::sync::OnceCell", reason = "use std::sync::OnceLock" },
]
