# `committed` (https://github.com/crate-ci/committed) — Conventional Commits
# linter run by the commit-msg lefthook hook and by CI on PR titles.

style = "conventional"

subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true

# 50/72 — the Linux-kernel rule for legible `git log --oneline`.
subject_length = 72
line_length = 72
hard_line_length = 0

no_fixup = true
no_wip = true

# Squash merges look like merges to committed but their subject is the PR
# title, which we want linted.
merge_commit = true

allowed_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]
allowed_scopes = []
