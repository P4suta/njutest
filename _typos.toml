# typos (https://github.com/crate-ci/typos) configuration.
# Named `_typos.toml` so it doesn't shadow Cargo features matching on `typos.*`.

[default]
extend-ignore-identifiers-re = [
  "[A-Fa-f0-9]{7,}",  # git SHAs and content digests
  "U\\+[0-9A-Fa-f]+", # Unicode codepoint references
]

[default.extend-words]
mut = "mut"           # Rust keyword
mutants = "mutants"
nto = "nto"           # QNX Neutrino, a rustc target_os
WRONLY = "WRONLY"     # rustix open flag
Yasunobu = "Yasunobu"

[files]
extend-exclude = [
  "target/",
  "*.lock",
  "*.golden",                           # instrumentation output compared byte for byte
  "*.input",
  "fixtures/",                          # deliberately weak, odd, or non-ASCII code under test
  "xtask/tests/testdata/engine-run-*/", # recorded runs over fixtures, quoting their code
  "CHANGELOG.md",
]
