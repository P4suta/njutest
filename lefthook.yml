# njutest — lefthook hooks. Runs straight on the host (cargo + typos).
#
# Enable after clone:  `lefthook install` (bootstrap.sh does it)
# Disable:             `lefthook uninstall`
#
# Strictness policy:
# - pre-commit is the gentle pass: format-and-restage, deny obvious mistakes.
#   `ocomment` was a second, weaker, unpinned opinion about the rule `cargo xtask lints` already holds, and the only step here without the `|| true` its neighbours have: a fresh clone that ran bootstrap.sh had every commit fail, with no diagnosis, on a tool nothing told them to install.
#   Nothing here analyses the whole workspace, and a clippy run is the thing that was taken out to make that true.
#   `glob` decides whether a command runs, not what it runs over, and clippy is a whole-crate analysis with no way to be pointed at the files being committed — so it read the working tree and refused commits for edits that were not in them.
#   A red that is not about your change teaches people to re-run rather than to read.
# - pre-push is `cargo xtask pre-push` (xtask/src/prepush.rs).
#   It checks out the exact object the push names into the repository's one gate tree and runs `mise run check` there.
#   A different ref is refused, and neither adjacent edits nor ignored local files can become check inputs.
#   Every worktree of the repository shares that tree and its build, so a push from a fresh worktree is warm rather than a rebuild from nothing.
#   One whole-workspace run holds this machine at a time (xtask/src/lanes.rs); a second push waits, and says whom it is waiting for.
#   A commit that passed against the same base within the hour is not checked again, which is what a push to the hub and then to origin used to pay twice.
# - `mise run check` is every gate a push waits for that this machine answers in minutes: formatting, clippy, rustdoc, the repository gates, the fuzz crate's type check, spelling, TOML, the workflows, the fast suite, the doctests, the Kani laws, licences and advisories.
#   Waiting for CI to say a golden is stale is waiting twenty minutes to be told something this machine knew in three, and a red `main` costs more than every push that was ever made to wait.
#
#   What is still CI's alone: the suite on Linux and Windows, the toolchain suite (`mise run test:slow`, which CI runs on four platforms), the coverage ratchets, the suite under Miri, and the composite action driven the way another repository drives it.

pre-commit:
  parallel: true
  skip:
    - rebase
    - merge
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    typos:
      run: typos
    taplo:
      glob: "*.toml"
      run: command -v taplo >/dev/null 2>&1 && taplo fmt {staged_files} || true
      stage_fixed: true
    actionlint:
      glob: ".github/**/*.{yml,yaml}"
      run: command -v actionlint >/dev/null 2>&1 && actionlint || true

commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}

pre-push:
  skip:
    - rebase
  commands:
    check:
      run: cargo xtask pre-push
      use_stdin: true

post-merge:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true
    # Takes back build output and temporary directories nobody has written for a while, so a machine that develops all day does not fill up; the push gate does the same when it ends.
    sweep:
      run: cargo xtask sweep --budget-seconds 5

post-checkout:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true
