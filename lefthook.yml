# njutest — lefthook hooks. Runs straight on the host (cargo + typos).
#
# Enable after clone:  `lefthook install` (bootstrap.sh does it)
# Disable:             `lefthook uninstall`
#
# Strictness policy:
# - pre-commit is the gentle pass: format-and-restage, deny obvious mistakes.
# - pre-push runs `mise run check`, which is every gate this machine can
#   answer: formatting, the build, clippy, rustdoc, the repository gates, the
#   fuzz crate's type check, spelling, TOML, the workflows, the whole suite
#   including the toolchain one, the doctests, licences, advisories, the book,
#   and the packaging a release would do. Minutes, not seconds — deliberately.
#   Waiting for CI to say a golden is stale is waiting twenty minutes to be
#   told something this machine knew in three, and a red `main` costs more
#   than every push that was ever made to wait.
#
#   Four answers are still CI's alone, because this machine cannot give them:
#   the suite on Linux and Windows, the coverage ratchets (a second
#   instrumented run of everything), the suite under Miri, and the composite
#   action driven the way another repository drives it.

pre-commit:
  parallel: true
  skip:
    - rebase
    - merge
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    rust-clippy:
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets -- -D warnings
    typos:
      run: typos
    taplo:
      glob: "*.toml"
      run: command -v taplo >/dev/null 2>&1 && taplo fmt {staged_files} || true
      stage_fixed: true
    actionlint:
      glob: ".github/**/*.{yml,yaml}"
      run: command -v actionlint >/dev/null 2>&1 && actionlint || true

commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}

pre-push:
  skip:
    - rebase
  commands:
    check:
      run: mise run check

post-merge:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true

post-checkout:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true
