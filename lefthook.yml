# njutest — lefthook hooks. Runs straight on the host (cargo + typos).
#
# Enable after clone:  `lefthook install` (bootstrap.sh does it)
# Disable:             `lefthook uninstall`
#
# Strictness policy:
# - pre-commit is the gentle pass: format-and-restage, deny obvious mistakes.
#   `ocomment` was a second, weaker, unpinned opinion about the rule `cargo xtask lints` already holds, and the only step here without the `|| true` its neighbours have: a fresh clone that ran bootstrap.sh had every commit fail, with no diagnosis, on a tool nothing told them to install.
#   Nothing here analyses the whole workspace, and a clippy run is the thing
#   that was taken out to make that true. `glob` decides whether a command
#   runs, not what it runs over, and clippy is a whole-crate analysis with no
#   way to be pointed at the files being committed — so it read the working
#   tree and refused commits for edits that were not in them. A red that is
#   not about your change teaches people to re-run rather than to read.
#   pre-push renders the exact object the push names into a fresh detached
#   worktree and runs the long check there. A different ref is refused, and
#   neither adjacent edits nor ignored local files can become check inputs.
# - pre-push runs `mise run check`, which is every gate this machine can
#   answer: formatting, the build, clippy, rustdoc, the repository gates, the
#   fuzz crate's type check, spelling, TOML, the workflows, the whole suite
#   including the toolchain one, the doctests, licences, advisories, the book,
#   and the packaging a release would do. Minutes, not seconds — deliberately.
#   Waiting for CI to say a golden is stale is waiting twenty minutes to be
#   told something this machine knew in three, and a red `main` costs more
#   than every push that was ever made to wait.
#
#   Four answers are still CI's alone, because this machine cannot give them:
#   the suite on Linux and Windows, the coverage ratchets (a second
#   instrumented run of everything), the suite under Miri, and the composite
#   action driven the way another repository drives it.

pre-commit:
  parallel: true
  skip:
    - rebase
    - merge
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    typos:
      run: typos
    taplo:
      glob: "*.toml"
      run: command -v taplo >/dev/null 2>&1 && taplo fmt {staged_files} || true
      stage_fixed: true
    actionlint:
      glob: ".github/**/*.{yml,yaml}"
      run: command -v actionlint >/dev/null 2>&1 && actionlint || true

commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}

pre-push:
  skip:
    - rebase
  commands:
    check:
      run: scripts/pre-push-check.sh
      use_stdin: true

post-merge:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true

post-checkout:
  commands:
    cargo-fetch-warm:
      glob: "{Cargo.toml,Cargo.lock,crates/*/Cargo.toml}"
      run: cargo fetch --quiet || true
