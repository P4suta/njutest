# A test that stops answering is not a slow test, and waiting for the job's own
# timeout to say so costs the whole suite's worth of time to learn one thing.
# One of these held a Windows runner for forty minutes: it was reported as a
# cancelled job at forty-five, with no test named, rather than as one test that
# never returned.
#
# The period is what a test may take before it is called slow, and the count is
# how many of them it may take before it is stopped. The suites here that drive
# a real cargo are minutes long on a cold cache, so the product is generous;
# what it refuses is the test that is not going to finish at all.
# Every test in a `toolchain_*` binary starts a cargo of its own, and the machine is shared by every
# session developing here. The group bounds how many run at once whoever starts nextest, and
# `njutest_devkit::paths::nested_build_jobs` gives each of their cargos its share of the cores.
[test-groups]
toolchain = { max-threads = 4 }
durable = { max-threads = 1 }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# A test that replaces an entry hundreds of times under a reader makes a thousand durable writes, and each waits on a disk other builds are using: it ran past the minute below at load 26 and passes alone in two seconds.
# It keeps a progress watch of its own, which is the detector; this is the backstop, and one at a time keeps two such loops from waiting on each other.
[[profile.default.overrides]]
filter = 'test(/_while_a_run_replaces_it_is_one_whole_/)'
test-group = "durable"
slow-timeout = { period = "60s", terminate-after = 5 }

# One in-process test whose work is not one test's size: every source of this repository instrumented and read again.
# It spreads the files across one worker per core, so it asks for every core and runs alone, and then keeps the inner loop's budget.
# Run beside the rest of the suite on one thread it took 88s alone at load 13 on Linux and ran past five minutes at load 40.
[[profile.default.overrides]]
filter = 'test(/::every_source_of_this_repository_still_parses_once_it_is_instrumented$/)'
threads-required = "num-cpus"

# Two in-process tests whose work is sized by a reading's bound rather than by one test: each reads texts exactly as deep and as long as a reading holds, and one past it.
# In the debug build they took 11s and 6s on this Mac, 47s and 31s on Linux, and one ran past the inner loop's minute on Windows before passing in 45s on its retry.
# The bound is the subject, so the budget is theirs; the inner loop's still catches a test that stops answering.
[[profile.default.overrides]]
filter = 'binary(=suite) & test(/^depth::(a_chain_exactly_as_long_as_a_reading_holds_is_read_and_one_longer_is_refused|the_costliest_shapes_read_at_both_bounds_at_once)$/)'
slow-timeout = { period = "60s", terminate-after = 4 }

# The in-process command tests start a cargo and the toolchain's own work, about ten seconds each on this Mac.
# A dozen of them starting at once ran each past the inner loop's minute, so they share the toolchain group's bound.
[[profile.default.overrides]]
filter = 'binary_id(rust-mutants-cli::suite) & test(/^(commands_in_process|commands_lines|doctor_checks)::/)'
test-group = "toolchain"

# Four observation tests locate a real toolchain in a fresh publication root, so each identifies the whole sysroot cold: 1.4 GB in 4,083 files on this Mac.
# One takes 25s alone; the four at once took 41-45s each, and one ran past the inner loop's minute in the pre-push suite.
# The work is the toolchain's, so they share the toolchain group's bound and keep a budget sized to it.
[[profile.default.overrides]]
filter = 'binary_id(rust-mutants) & test(/^cargo::observed::tests::(independent_identity_owners_keep_both_actual_supplemental_captures|an_older_content_key_neither_rehashes_nor_repoints_the_identity_cursor|a_consistently_rewritten_cursor_is_refused_without_its_publication|a_known_rustup_selector_reuses_its_actual_toolchain_observation)$/)'
test-group = "toolchain"
slow-timeout = { period = "60s", terminate-after = 4 }

# The inner loop starts no toolchain, so a test there taking a minute is
# already a test that has stopped answering.
[[profile.default.overrides]]
filter = 'not binary(/^toolchain_/)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(=toolchain_gates) & test(/^claims_oracle::/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'binary(/^toolchain_/)'
test-group = "toolchain"

[profile.cost]

[profile.cost.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

[profile.ci]
status-level = "pass"

[profile.ci.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
