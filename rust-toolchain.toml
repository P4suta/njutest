[toolchain]
channel = "1.98.0"
# llvm-tools: `llvm-profdata` and `llvm-cov` are how mjutest reads coverage,
# and how CI measures its own.
components = ["rustfmt", "clippy", "llvm-tools"]
profile = "minimal"
