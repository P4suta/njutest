[package]
name = "mjutest-cli"
description = "mjutest: an audit-oriented assurance runner for Rust — coverage-routed mutation testing with proofs, not budgets"
keywords = ["mutation-testing", "testing", "assurance", "coverage", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "mjutest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "mjutest"
path = "src/main.rs"
# The binary is one function; its documentation is the library's.
doc = false

[[bin]]
name = "cargo-mjutest"
path = "src/bin/cargo-mjutest/main.rs"
# The same program under the name cargo looks for; its documentation is the library's.
doc = false

[package.metadata.binstall]
# The archive `release.yml` builds, so `cargo binstall mjutest` finds what the
# release published rather than compiling the workspace again.
pkg-url = "{ repo }/releases/download/v{ version }/mjutest-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "mjutest-{ version }-{ target }/{ bin }{ binary-ext }"

[features]
# Test support (fixture builders, scripted fakes) that a sibling crate's tests
# may enable. Never enabled by a production dependency: `xtask devgates`.
testkit = []

[dependencies]
clap = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
hex = { workspace = true }
rust-mutants = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
sha2 = { workspace = true }
rustix = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
criterion = { workspace = true }
jsonschema = { workspace = true }
mjutest-devkit = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "report"
harness = false

[[bench]]
name = "evidence"
harness = false

[lints]
workspace = true
