[package]
name = "mjutest-cli"
description = "mjutest: an audit-oriented assurance runner for Rust — coverage-routed mutation testing with proofs, not budgets"
keywords = ["mutation-testing", "testing", "assurance", "coverage", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "mjutest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "mjutest"
path = "src/main.rs"
# The binary is one function; its documentation is the library's.
doc = false

[features]
# Test support (fixture builders, scripted fakes) that a sibling crate's tests
# may enable. Never enabled by a production dependency: `xtask devgates`.
testkit = []

[dependencies]
clap = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
hex = { workspace = true }
rust-mutants = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
mjutest-devkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
