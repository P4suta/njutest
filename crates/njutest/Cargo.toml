[package]
name = "njutest"
description = "Attach integration-resource metadata to ordinary Rust tests for the njutest assurance runner"
keywords = ["testing", "assurance", "integration-tests"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.njutest]
surface = "public"

[dependencies]
njutest-macros = { workspace = true }

[dev-dependencies]
njutest-devkit = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
