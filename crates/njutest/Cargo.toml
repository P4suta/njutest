[package]
name = "njutest"
description = "njutest, an audit-oriented assurance runner for Rust, at the command line: njutest and cargo-njutest"
keywords = ["mutation-testing", "testing", "assurance", "coverage", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "njutest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
autotests = false

[package.metadata.njutest]
surface = "incidental"

[[bin]]
name = "njutest"
path = "src/main.rs"
doc = false

[[bin]]
name = "cargo-njutest"
path = "src/bin/cargo-njutest/main.rs"
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/njutest-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "njutest-{ version }-{ target }/{ bin }{ binary-ext }"

[features]
benchmarks = ["dep:criterion"]
testkit = ["rust-mutants/testkit"]

[dependencies]
njutest-macros = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true, optional = true }
jiff = { workspace = true, features = ["serde"] }
hex = { workspace = true }
rust-mutants = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
getrandom = { workspace = true }
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]

[dev-dependencies]
hex = { workspace = true }
njutest = { workspace = true, features = ["testkit"] }
proptest = { workspace = true }
sha2 = { workspace = true }
rustix = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
jsonschema = { workspace = true }
njutest-devkit = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "report"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "evidence"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "toolchain_baseline"
path = "tests/toolchain_baseline.rs"

[[test]]
name = "toolchain_build"
path = "tests/toolchain_build.rs"

[[test]]
name = "toolchain_cli_contract"
path = "tests/toolchain_cli_contract.rs"

[[test]]
name = "toolchain_commands"
path = "tests/toolchain_commands.rs"

[[test]]
name = "toolchain_edits"
path = "tests/toolchain_edits.rs"

[[test]]
name = "toolchain_generation"
path = "tests/toolchain_generation.rs"

[[test]]
name = "toolchain_interrupt"
path = "tests/toolchain_interrupt.rs"

[[test]]
name = "toolchain_knobs"
path = "tests/toolchain_knobs.rs"

[[test]]
name = "toolchain_lsp"
path = "tests/toolchain_lsp.rs"

[[test]]
name = "toolchain_mutation"
path = "tests/toolchain_mutation.rs"

[[test]]
name = "toolchain_repeatable"
path = "tests/toolchain_repeatable.rs"

[[test]]
name = "toolchain_replay"
path = "tests/toolchain_replay.rs"

[[test]]
name = "toolchain_resource_run"
path = "tests/toolchain_resource_run.rs"

[[test]]
name = "toolchain_run_documents"
path = "tests/toolchain_run_documents.rs"

[[test]]
name = "toolchain_select"
path = "tests/toolchain_select.rs"

[[test]]
name = "toolchain_targets"
path = "tests/toolchain_targets.rs"

[[test]]
name = "toolchain_verify"
path = "tests/toolchain_verify.rs"

[[test]]
name = "toolchain_watch"
path = "tests/toolchain_watch.rs"

[[test]]
name = "toolchain_wire_fixture"
path = "tests/toolchain_wire_fixture.rs"
