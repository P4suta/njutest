[package]
name = "rust-mutants"
description = "Mutation testing engine for Rust, as a library. Install rust-mutants-cli for the command line."
keywords = ["mutation-testing", "testing", "cargo", "assurance"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
autotests = false

[package.metadata.njutest]
surface = "public"

[features]
benchmarks = ["dep:criterion"]
testkit = []

[dependencies]
njutest-macros = { workspace = true }
criterion = { workspace = true, optional = true }
hex = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
proc-macro2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["printing"] }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
njutest-devkit = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "foundation"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "toolchain_2021"
path = "tests/toolchain_2021.rs"

[[test]]
name = "toolchain_cargo"
path = "tests/toolchain_cargo.rs"

[[test]]
name = "toolchain_compiled_catalog"
path = "tests/toolchain_compiled_catalog.rs"

[[test]]
name = "toolchain_coverage"
path = "tests/toolchain_coverage.rs"

[[test]]
name = "toolchain_discover"
path = "tests/toolchain_discover.rs"

[[test]]
name = "toolchain_drift"
path = "tests/toolchain_drift.rs"

[[test]]
name = "toolchain_durable"
path = "tests/toolchain_durable.rs"

[[test]]
name = "toolchain_entered"
path = "tests/toolchain_entered.rs"

[[test]]
