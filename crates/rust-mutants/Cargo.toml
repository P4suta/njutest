[package]
name = "rust-mutants"
description = "Mutation testing engine for Rust: one instrumented snapshot, every compilable mutant behind a guard, one environment variable per test process"
keywords = ["mutation-testing", "testing", "cargo", "assurance"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.njutest]
surface = "public"

[features]
benchmarks = ["dep:criterion"]
testkit = []

[dependencies]
njutest-macros = { workspace = true }
criterion = { workspace = true, optional = true }
hex = { workspace = true }
getrandom = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
proc-macro2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["printing"] }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
njutest-devkit = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "foundation"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["benchmarks"]

[lints]
workspace = true
