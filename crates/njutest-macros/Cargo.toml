[package]
name = "njutest-macros"
description = "Procedural macros of the njutest workspace. Published because the command lines depend on it; install njutest-cli or rust-mutants-cli."
keywords = ["testing", "assurance", "macro"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.njutest]
surface = "public"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true }
syn = { workspace = true, features = ["derive", "printing", "proc-macro"] }

[dev-dependencies]
trybuild = { workspace = true }

[lints]
workspace = true
