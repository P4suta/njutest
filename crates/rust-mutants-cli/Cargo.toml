[package]
name = "rust-mutants-cli"
description = "The rust-mutants mutation testing engine at the command line: rust-mutants and cargo-rust-mutants"
keywords = ["mutation-testing", "testing", "cargo", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "rust-mutants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[package.metadata.njutest]
surface = "incidental"

[features]
testkit = []

[[bin]]
name = "rust-mutants"
path = "src/main.rs"
doc = false

[[bin]]
name = "cargo-rust-mutants"
path = "src/bin/cargo-rust-mutants/main.rs"
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/njutest-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "njutest-{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
njutest-macros = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
rust-mutants = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustix = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
proptest = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
njutest-devkit = { workspace = true }
rustix = { workspace = true }
tempfile = { workspace = true }
rust-mutants-cli = { path = ".", features = ["testkit"] }

[lints]
workspace = true
