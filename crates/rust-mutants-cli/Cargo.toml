[package]
name = "rust-mutants-cli"
description = "Command line for the rust-mutants mutation testing engine"
keywords = ["mutation-testing", "testing", "cargo", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "rust-mutants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "rust-mutants"
path = "src/main.rs"
# The binary is one function; its documentation is the library's.
doc = false

[dependencies]
clap = { workspace = true }
rust-mutants = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
mjutest-devkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
