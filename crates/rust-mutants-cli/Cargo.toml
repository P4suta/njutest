[package]
name = "rust-mutants-cli"
description = "Command line for the rust-mutants mutation testing engine"
keywords = ["mutation-testing", "testing", "cargo", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "rust-mutants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "rust-mutants"
path = "src/main.rs"
# The binary is one function; its documentation is the library's.
doc = false

[dependencies]
clap = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
rust-mutants = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustix = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
# The engine's own testkit, for the tests that need a source in a shape they
# would otherwise commit a second copy of.
rust-mutants = { workspace = true, features = ["testkit"] }
mjutest-devkit = { workspace = true }
rustix = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
