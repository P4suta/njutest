[package]
name = "njutest-cli"
description = "njutest: an audit-oriented assurance runner for Rust — coverage-routed mutation testing with proofs, not budgets"
keywords = ["mutation-testing", "testing", "assurance", "coverage", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]
default-run = "njutest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "njutest"
path = "src/main.rs"
doc = false

[[bin]]
name = "cargo-njutest"
path = "src/bin/cargo-njutest/main.rs"
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/njutest-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "njutest-{ version }-{ target }/{ bin }{ binary-ext }"

[features]
testkit = []

[dependencies]
clap = { workspace = true }
jiff = { workspace = true, features = ["serde"] }
hex = { workspace = true }
rust-mutants = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
signal-hook = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
njutest-cli = { workspace = true, features = ["testkit"] }
proptest = { workspace = true }
sha2 = { workspace = true }
rustix = { workspace = true }
rust-mutants = { workspace = true, features = ["testkit"] }
criterion = { workspace = true }
jsonschema = { workspace = true }
njutest-devkit = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "report"
harness = false

[[bench]]
name = "evidence"
harness = false

[lints]
workspace = true
