[workspace]
resolver = "3"
members = ["compiler-surfaces", "crates/*", "xtask"]
# Fixture projects are independent cargo workspaces the integration tests
# drive with a real `cargo`; they are never built as part of this workspace.
exclude = ["fixtures/*", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/P4suta/njutest"
homepage = "https://github.com/P4suta/njutest"
authors = ["njutest contributors"]
readme = "README.md"

[workspace.lints.rust]
# `deny`, not `forbid`: the process supervisor and the temporary-directory
# owner need Windows FFI (Job Objects, LockFileEx) in exactly two modules,
# whose individual FFI boundaries carry `#[expect(unsafe_code, reason = ...)]`.
# Every crate that needs
# none carries `#![forbid(unsafe_code)]` at its root.
unsafe_code = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Restriction lints, enabled deliberately. Narrow `#[expect]` attributes carry
# a reason; the repository syntax gate refuses `#[allow]` entirely.
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# Allowed: the fix would rename well-named types, or is outside our control
# (transitive dependency versions).
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
# These style suggestions hide branch policy inside fallback combinators. The
# repository deliberately spells the arms out so a new state cannot inherit a
# default answer merely because Clippy can shorten the expression.
option_if_let_else = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
manual_ok_err = "allow"
single_match_else = "allow"
manual_let_else = "allow"

[workspace.dependencies]
# Internal crates. Version and path together so a member can be published.
njutest = { version = "0.1.0", path = "crates/njutest" }
rust-mutants = { version = "0.1.0", path = "crates/rust-mutants" }
njutest-macros = { version = "0.1.0", path = "crates/njutest-macros" }
njutest-devkit = { version = "0.1.0", path = "crates/njutest-devkit" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.3"
# syn 3: the instrumentation never pretty-prints, so `printing` stays off.
syn = { version = "3", default-features = false, features = [
  "full",
  "parsing",
  "visit",
  "extra-traits",
  "clone-impls",
] }
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
quote = "1.0"
toml = "1.1"
toml_edit = "0.25"
schemars = "1.2"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
rustix = { version = "1.1", features = ["fs", "process", "termios"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
jiff = "0.2"
ratatui = "0.30"
# How wide a character is on a terminal, which is not how many bytes or how many
# `char`s it is. Already in the graph under ratatui, so this costs nothing but
# the honesty of naming what the renderer depends on.
unicode-width = "0.2"
signal-hook = { version = "0.4", default-features = false }
globset = "0.4"
walkdir = "2.5"
cargo_metadata = "0.23"
similar = { version = "3.2", default-features = false, features = ["text"] }

# Test-only.
tempfile = "3.27"
proptest = "1.11"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
jsonschema = { version = "0.56", default-features = false }
trybuild = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

# A test binary of this workspace is 73 MB, and 94% of that is DWARF nobody
# reads: a failing test is read from its backtrace, which needs the file and
# the line and not the variables. Keeping the full record cost 51 GB of the
# 54 GB `target/debug/deps` holds, and filled the disk twice in one day.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# cargo-mutants (the external tool that mutates *this* repository) builds with
# this profile: see .cargo/mutants.toml.
[profile.mutants]
inherits = "test"
debug = "none"
