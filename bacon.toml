#
# bacon configuration.
# Launch with `bacon` for the default `check` job, or `bacon clippy` / `bacon test` / `bacon nextest` / `bacon doc`.
# A job that builds or tests selects `--workspace --all-features`, the one feature set the gate compiles, so a job run here warms what a push reads.
#
# Config reference: https://dystroy.org/bacon/config/

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["crates", "xtask"]
on_change_strategy = "kill_then_restart"

[jobs.clippy]
command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--color",
  "always",
  "--",
  "-D",
  "warnings",
]
need_stdout = false

# The inner loop: everything that starts no toolchain.
[jobs.test]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--color",
  "always",
  "-E",
  "not binary(/^toolchain_/)",
]
need_stdout = true

[jobs.nextest]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--color",
  "always",
  "-E",
  "not binary(/^toolchain_/)",
]
need_stdout = true

# Every test, the fixture-driven ones included.
[jobs.test-all]
command = [
  "cargo",
  "nextest",
  "run",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--color",
  "always",
]
need_stdout = true

# The repository's own gates.
[jobs.gates]
command = ["cargo", "xtask", "all"]
need_stdout = true

[jobs.doc]
command = [
  "cargo",
  "doc",
  "--workspace",
  "--no-deps",
  "--document-private-items",
  "--color",
  "always",
]
need_stdout = false
